{"name":"prueba-fightcade","on":"workflow_dispatch","jobs":{"prueba":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/setup-node@v4","with":{"node-version":"20"}},{"run":"npm i playwright && npx playwright install --with-deps chromium"},{"run":"cat > t.js <<'EOF'\nconst {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();let ok=0;try{const r=await p.goto('https://www.fightcade.com/',{waitUntil:'domcontentloaded',timeout:60000});console.log('home',r.status(),await p.title());await p.waitForTimeout(8000);console.log('titulo tras espera',await p.title());for(const g of ['sfa3','kof98','ssf2x']){const o=await p.evaluate(async(g)=>{const res=await fetch('/api/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({req:'searchquarks',gameid:g,offset:0,limit:5,ranked:true,best:false})});const t=await res.text();return {s:res.status,h:t.slice(0,200)}},g);console.log(g,JSON.stringify(o));if(o.s==200)ok++}}catch(e){console.log('ERR',e.message)}console.log('RESULTADO',ok,'de 3');await b.close()})()\nEOF\nnode t.js"}]}}}
