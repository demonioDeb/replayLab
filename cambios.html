<body>
<header id="cabsitio"></header>

<main class="wrap">
  <div class="intro"><div><h1 id="titulo"></h1><p id="sub"></p></div></div>
  <!-- pestañas: todo, la web, y una por juego -->
  <div class="atabs c-areas" id="areas" role="tablist"></div>
  <p class="c-desc" id="c-desc"></p>
  <div id="cambios" class="diario"></div>
</main>

<footer class="wrap" id="pie"></footer>

<script src="assets/app.js?v=53d960e98d"></script>
<script>
"use strict";
let DATOS = null;

// Un color por tipo de entrada, igual que los momentos de la ficha: se lee de un vistazo
// si un día fue de descubrir algo, de añadir, de cambiar o de arreglar.
const TIPO = {
  hallazgo:  ["c_hallazgo",  "#7dfcb0"],
  "añadido": ["c_añadido",   "#37c8ff"],
  cambiado:  ["c_cambiado",  "#ffcb45"],
  arreglado: ["c_arreglado", "#ff8d9b"],
};

// El texto de cada entrada está en español e inglés; en los demás idiomas se cae al
// español, que es en el que se trabaja. Mejor eso que una traducción inventada.
const texto = c => c[LANG] || c.es || "";

const fechaLarga = f => {
  try {
    const [y, m, d] = f.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString(LANG,
      { timeZone: "UTC", year: "numeric", month: "long", day: "numeric" });
  } catch (e) { return f; }
};

// Cada cambio lleva su área: "web" (lo que se ve en replayLab) y/o "juego" (overlay,
// grabación, lo que se descubrió del juego, YouTube), y el juego o juegos a los que toca
// ("juego": un id de datos/juegos.json, o una lista si vale para varios).
// Pestañas: Todo · 🌐 Web · una por juego. ?area=web o ?juego=<id>, para poder compartir.
const areas = c => c.area || ["web"];
const juegosDe = c => [].concat(c.juego || []);
const nombreJuego = id => (juegoPorId(id) || {}).nombre_completo || (juegoPorId(id) || {}).nombre || id || "";
const cortoJuego = id => (juegoPorId(id) || {}).corto || id;
let FILTRO = Q.get("juego") ? "j:" + Q.get("juego") : (Q.get("area") === "web" ? "web" : "");
const pasa = (c, f) => !f || (f === "web" ? areas(c).includes("web") : juegosDe(c).includes(f.slice(2)));

function grupo(icono, titulo, lista) {
  if (!lista.length) return "";
  return `<div class="c-grupo"><div class="c-gt">${icono} ${esc(titulo)}<span class="cuantos">${lista.length}</span></div>` +
    lista.map(c => {
      const [clave, color] = TIPO[c.t] || ["c_cambiado", "#94a6cc"];
      return `<div class="cfila">
        <span class="sello" style="--c:${color}">${esc(T(clave))}</span>
        <span class="ct">${esc(texto(c))}</span></div>`;
    }).join("") + `</div>`;
}

function pinta() {
  document.documentElement.lang = LANG;
  $("#titulo").textContent = T("t_cambios");
  $("#sub").textContent = T("sub_cambios");
  textosCabecera(); pintaPie();
  if (!DATOS) return;
  const todas = (DATOS.dias || []).flatMap(d => d.cambios || []);
  // un juego tiene pestaña si tiene cambios; en el orden de datos/juegos.json
  const conCambios = new Set(todas.flatMap(juegosDe));
  const ids = [...(JUEGOS || []).map(j => j.id).filter(id => conCambios.has(id)),
               ...[...conCambios].filter(id => !juegoPorId(id))];
  if (FILTRO.startsWith("j:") && !ids.includes(FILTRO.slice(2))) FILTRO = "";
  const tabs = [["", "📋", T("c_todo"), ""], ["web", "🌐", T("c_web"), ""],
                ...ids.map(id => ["j:" + id, "🎮", cortoJuego(id), nombreJuego(id)])];
  $("#areas").innerHTML = tabs.map(([f, ic, t, largo]) =>
    `<button class="atab" role="tab" data-f="${esc(f)}" aria-selected="${FILTRO === f}"${largo ? ` title="${esc(largo)}"` : ""}>
      ${ic} ${esc(t)} <span class="n">${todas.filter(c => pasa(c, f)).length}</span></button>`).join("");
  const desc = FILTRO === "web" ? T("c_web_d") : FILTRO ? nombreJuego(FILTRO.slice(2)) + " · " + T("c_juego_d") : "";
  $("#c-desc").textContent = desc;
  $("#c-desc").hidden = !desc;

  $("#cambios").innerHTML = (DATOS.dias || []).map(d => {
    const cs = (d.cambios || []).filter(c => pasa(c, FILTRO));
    let cuerpo = "";
    if (FILTRO.startsWith("j:")) {
      // dentro de un juego, todo lo suyo junto: lo del juego y lo que cambió en su web
      cuerpo = grupo("🎮", nombreJuego(FILTRO.slice(2)), cs.filter(c => areas(c).includes("juego")))
             + grupo("🌐", T("c_web"), cs.filter(c => !areas(c).includes("juego")));
    } else {
      const web = FILTRO === "web" || !FILTRO ? cs.filter(c => areas(c).includes("web")) : [];
      const deJuego = FILTRO ? [] : cs.filter(c => areas(c).includes("juego"));
      // un cambio que vale para varios juegos sale una vez, en «Todos los juegos»
      const clave = c => juegosDe(c).length > 1 ? "*" : (juegosDe(c)[0] || "");
      const grupos = [...new Set(deJuego.map(clave))];
      cuerpo = grupo("🌐", T("c_web"), web) + grupos.map(k =>
        grupo("🎮", k === "*" ? T("c_varios") : (nombreJuego(k) || T("c_juegos")), deJuego.filter(c => clave(c) === k))).join("");
    }
    if (!cuerpo) return "";
    return `<section class="dia">
      <h3><span class="fecha">${esc(fechaLarga(d.fecha))}</span></h3>
      ${cuerpo}</section>`;
  }).join("");
}

$("#areas").addEventListener("click", e => {
  const b = e.target.closest("[data-f]");
  if (!b) return;
  FILTRO = b.dataset.f;
  const u = new URL(location.href);
  u.searchParams.delete("area"); u.searchParams.delete("juego");
  if (FILTRO === "web") u.searchParams.set("area", "web");
  else if (FILTRO) u.searchParams.set("juego", FILTRO.slice(2));
  history.replaceState(null, "", u);
  sinSalto(pinta, "#areas");
});

montaCabecera("cambios", pinta);
cargaBase(pinta);
pinta();
json("datos/cambios.json").then(d => { DATOS = d; pinta(); }).catch(() => {});
</script>
</body>
</html>
