<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canal de YouTube · replayLab</title>
<meta name="description" content="El canal de YouTube de replayLab: todas las partidas en vídeo, con el overlay de estadísticas en directo.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0a0d15">
<!-- vista previa al compartir (Open Graph / X): imagen de 1200 × 630 en assets/og.png -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="replayLab">
<meta property="og:title" content="Canal de YouTube · replayLab">
<meta property="og:description" content="El canal de YouTube de replayLab: todas las partidas en vídeo, con el overlay de estadísticas en directo.">
<meta property="og:url" content="https://demoniodeb.github.io/replayLab/canal.html">
<meta property="og:image" content="https://demoniodeb.github.io/replayLab/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="replayLab: replays de juegos de pelea de Fightcade con estadísticas">
<meta property="og:locale" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Canal de YouTube · replayLab">
<meta name="twitter:description" content="El canal de YouTube de replayLab: todas las partidas en vídeo, con el overlay de estadísticas en directo.">
<meta name="twitter:image" content="https://demoniodeb.github.io/replayLab/assets/og.png">
<link rel="stylesheet" href="assets/estilo.css?v=0bbf970e03">
</head>
<body>
<header id="cabsitio"></header>

<main class="wrap">
  <!-- El canal: sus datos vienen de datos/canal.json (API de YouTube, la escribe fcrec).
       Se enseñan tal cual y sólo si tienen menos de 30 días (reglas de la API). -->
  <section class="yt-hero" id="hero"></section>

  <section class="bloque" id="b-videos">
    <div class="bloque-cab"><h2 id="t-ultimos"></h2></div>
    <div class="yt-grid" id="videos"></div>
    <p class="vacio" id="v-vacio" hidden></p>
  </section>

  <section class="bloque">
    <div class="yt-info" id="info"></div>
  </section>

  <div id="apoyo"></div>
</main>

<footer class="wrap" id="pie"></footer>

<script src="assets/app.js?v=0ee76912ef"></script>
<script src="assets/lista.js?v=005562bfb5"></script>
<script>
"use strict";
let INDICE = { videos: [] };
let CUANTOS = 12;

const cifra = (n, k) => n == null ? "" :
  `<div class="yt-cifra"><b>${milesDe(n)}</b><span>${esc(T(k))}</span></div>`;

function pinta() {
  document.documentElement.lang = LANG;
  document.title = T("yt_titulo") + " · replayLab";
  textosCabecera(); pintaPie(); pintaApoyo();
  const ok = canalFresco(), c = CANAL || {};
  const sus = urlSuscribir(), ver = urlCanal();
  const botones = `<div class="yt-botones">
      ${sus ? `<a class="btn yt-rojo" href="${esc(sus)}" target="_blank" rel="noopener">🔔 ${esc(T("yt_suscribete"))}</a>` : ""}
      ${ver ? `<a class="btn" href="${esc(ver)}" target="_blank" rel="noopener">${esc(T("yt_ver_canal"))} ↗</a>` : ""}</div>`;
  $("#hero").innerHTML = ok
    ? `<div class="yt-cab">
         ${c.avatar ? `<img class="yt-avatar" src="${esc(c.avatar)}" alt="" referrerpolicy="no-referrer">` : ""}
         <div class="yt-id"><h1>${esc(c.nombre || "replayLab")}</h1>
           ${c.handle ? `<span class="yt-handle">@${esc(c.handle)}</span>` : ""}
           <p class="yt-desc">${esc(T("yt_sub"))}</p></div>
         ${botones}</div>
       <div class="yt-cifras">${c.suscriptores != null ? cifra(c.suscriptores, "yt_suscriptores") : ""}${cifra(c.videos, "yt_videos")}${cifra(c.vistas, "yt_vistas")}</div>
       <p class="yt-fuente">▶ ${esc(T("yt_datos").replace("%s", fechaCorta(c.actualizado)))}</p>`
    : `<div class="yt-cab"><div class="yt-id"><h1>▶ ${esc(T("yt_titulo"))}</h1><p class="yt-desc">${esc(T("yt_sub"))}</p></div>${botones}</div>
       <p class="yt-fuente">${esc(T("yt_pronto"))}</p>`;

  // últimos vídeos públicos; si la partida tiene ficha aquí, se abre la ficha
  $("#t-ultimos").textContent = T("yt_ultimos");
  const ficha = id => (INDICE.videos || []).find(v => v.youtube === id);
  const pub = ok ? (c.lista || []).filter(v => v.privacidad === "public")
                     .sort((a, b) => String(b.publicado).localeCompare(String(a.publicado))) : [];
  $("#b-videos").hidden = !ok;
  $("#v-vacio").hidden = !ok || pub.length > 0;
  $("#v-vacio").textContent = T("yt_sin_videos");
  $("#videos").innerHTML = pub.slice(0, CUANTOS).map(v => {
    const f = ficha(v.id);
    const href = f ? `video.html?q=${encodeURIComponent(f.quark)}` : `https://youtu.be/${encodeURIComponent(v.id)}`;
    return `<a class="yt-card" href="${esc(href)}"${f ? "" : ' target="_blank" rel="noopener"'}>
        <span class="yt-mini"><img src="${esc(v.miniatura || `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`)}" alt="" loading="lazy"></span>
        <span class="yt-c"><b class="yt-t">${esc(v.titulo || "")}</b>
          <span class="yt-m">${esc(fechaCorta(v.publicado))}${v.vistas != null ? " · " + esc(T("yt_vistas_n").replace("%s", milesDe(v.vistas))) : ""}</span>
          <span class="yt-etq">${f ? "📊 " + esc(T("yt_con_stats")) : "▶ " + esc(T("yt_ver")) + " ↗"}</span></span></a>`;
  }).join("");
  botonVerMas($("#videos"), pub.length - Math.min(CUANTOS, pub.length), () => { CUANTOS += 12; pinta(); });

  $("#info").innerHTML = `
    <div class="g-c"><h3><span aria-hidden="true">📺</span>${esc(T("yt_cuenta_t"))}</h3><p>${esc(T("yt_cuenta_d"))}</p></div>
    <div class="g-c"><h3><span aria-hidden="true">🤝</span>${esc(T("yt_apoyo_t"))}</h3><p>${esc(T("yt_apoyo_d"))}</p>
      ${sus ? `<p><a class="yt-link" href="${esc(sus)}" target="_blank" rel="noopener">🔔 ${esc(T("yt_suscribete"))} ↗</a></p>` : ""}</div>`;
}

montaCabecera("canal", pinta);
pinta();
Promise.all([cargaBase(), json("datos/indice.json").then(d => { INDICE = d; }).catch(() => {})])
  .then(pinta);
</script>
</body>
</html>
