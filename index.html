<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>replayLab</title>
<meta name="description" content="Análisis de partidas de juegos de pelea: replays de Fightcade grabados, con estadísticas leídas de la propia partida.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎮</text></svg>">
<link rel="stylesheet" href="assets/estilo.css?v=669543226c">
</head>
<body>
<header id="cabsitio"></header>

<main class="wrap">
  <!-- qué es, en una frase, y por dónde se entra -->
  <section class="hero">
    <h1 id="h-titulo"></h1>
    <p id="h-texto"></p>
    <div class="hero-cta">
      <a class="btn prim" href="partidas.html" id="h-ver"></a>
      <a class="btn" href="juegos.html" id="h-juegos-btn"></a>
    </div>
    <div class="hero-cifras" id="cifras"></div>
  </section>

  <section class="bloque">
    <div class="bloque-cab"><h2 id="t-juegos"></h2></div>
    <div class="rejilla-juegos" id="juegos"></div>
  </section>

  <section class="bloque">
    <div class="bloque-cab"><h2 id="t-ultimas"></h2><a class="ver-todo" href="partidas.html" id="t-todas"></a></div>
    <div id="lista" class="lista"></div>
    <div id="vacio" class="vacio" hidden></div>
  </section>

  <div id="apoyo"></div>
</main>

<footer class="wrap" id="pie"></footer>

<script src="assets/app.js?v=c69cec1271"></script>
<script src="assets/lista.js?v=82a0d35d3c"></script>
<script>
"use strict";
let INDICE = { videos: [] };
const ULTIMAS = 6;

function pinta() {
  document.documentElement.lang = LANG;
  textosCabecera(); pintaPie(); pintaApoyo();
  $("#h-titulo").textContent = T("h_titulo");
  $("#h-texto").textContent = T("h_texto");
  $("#h-ver").textContent = T("h_ver");
  $("#h-juegos-btn").textContent = T("n_juegos");
  $("#t-juegos").textContent = T("h_juegos");
  $("#t-ultimas").textContent = T("h_ultimas");
  $("#t-todas").textContent = T("h_todas") + " →";

  const todas = INDICE.videos || [];
  // tres cifras reales, sacadas del índice: nada inventado
  const peleas = todas.reduce((a, v) => a + (v.peleas || 0), 0);
  const rondas = todas.reduce((a, v) => a + (v.rondas || 0), 0);
  $("#cifras").innerHTML = todas.length ? [
      [todas.length, pl(todas.length, "u_partida", "u_partidas")], [peleas, pl(peleas, "u_pelea", "u_peleas")], [rondas, T("rondas_t").toLowerCase()],
    ].map(([n, t]) => `<span><b>${milesDe(n)}</b>${esc(t)}</span>`).join("") : "";

  // juegos: primero los activos, luego lo que viene
  const orden = [...juegosActivos(), ...JUEGOS.filter(j => j.estado !== "activo")];
  $("#juegos").innerHTML = orden.map(j => tarjetaJuego(j, todas)).join("");

  CHAPA_JUEGO = variosJuegos(todas);
  const ultimas = ordenaLista(todas, "fecha", true).slice(0, ULTIMAS);
  pintaLista($("#lista"), ultimas, "miniaturas");
  $("#t-todas").hidden = todas.length <= ULTIMAS;
  const vacio = $("#vacio");
  vacio.hidden = ultimas.length > 0;
  vacio.textContent = T("sin_videos");
}

montaCabecera("inicio", pinta);
pinta();
Promise.all([cargaBase(), json("datos/indice.json").then(d => { INDICE = d; }).catch(() => {})])
  .then(pinta);
</script>
</body>
</html>
