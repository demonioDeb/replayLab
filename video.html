    <!-- línea de tiempo de TODO el set (pulsar un momento lo pone en el vídeo) → el vídeo →
         peleas (la tira y la pelea elegida) → estadísticas (una tabla: set · pelea · ronda) -->

<script src="assets/app.js?v=f80bbfc3f7"></script>
<script>
"use strict";
let F = null, REPRO = null, LISTO = false;

/* Cada tipo de momento con su FORMA; el color es del jugador que lo hizo (rojo el 1,
   azul el 2). El dorado queda sólo para lo excepcional (perfect, remontada) y el doble KO,
   que no es de nadie, va en gris claro. Así el color siempre significa lo mismo.
   El orden es el de la leyenda y el de los filtros. */
const TIPOS = [
  ["ko",        "circulo"],
  ["combo",     "triangulo"],
  ["super",     "rombo"],
  ["mareo",     "estrella"],
  ["perfect",   "estrella"],
  ["remontada", "flecha"],
  ["doble_ko",  "cuadro"],
];
const FORMA = Object.fromEntries(TIPOS);
const ESPECIAL = new Set(["perfect", "remontada"]);
const colorMomento = x => ESPECIAL.has(x.tipo) ? "var(--gold)" : x.tipo === "doble_ko" ? "#cfd6e6"
  : x.jugador === 1 ? "var(--p1)" : x.jugador === 2 ? "var(--p2)" : "#cfd6e6";
// Qué da el juego de esta partida (la ficha lo trae desde la versión 7). Lo que el juego
// no da no se enseña: en Champion Edition no hay súper, y mareos y combos todavía no
// son datos seguros. Una ficha vieja sin `datos` es de ST, que lo da todo.
const DATOS = () => Object.assign({ super: true, stun: true, combos: true }, (F && F.datos) || {});
let APAGADOS = new Set();          // tipos de momento que el usuario ha ocultado

/* El reproductor se controla con la API de YouTube para poder saltar al segundo de
   cada pelea, ronda y momento. Si la API no carga, los botones abren el vídeo en una
   pestaña nueva con el segundo puesto: nunca se quedan sin hacer nada. */
function cargaApi() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  return new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => res();
    document.head.appendChild(s);
    setTimeout(res, 6000);
  });
}
function salta(t) {
  t = Math.max(0, t);
  if (REPRO && LISTO && REPRO.seekTo) {
    REPRO.seekTo(t, true); REPRO.playVideo();
    // ¿se ve el vídeo? (lo que queda debajo de la cabecera fija del sitio)
    const v = $("#video"), q = v && v.getBoundingClientRect();
    if (!q || !q.height) return;
    const tapa = ($("#cabsitio") && $("#cabsitio").getBoundingClientRect().bottom) || 0;
    const visto = Math.max(0, Math.min(q.bottom, innerHeight) - Math.max(q.top, tapa)) / q.height;
    if (visto >= 0.6) return;
    // En el móvil la pantalla NO se mueve sola (se estaba navegando): sale un botón que
    // lleva al vídeo si quieres. Con ratón, el vídeo se trae a la vista como antes.
    if (TACTIL) avisoVideo();
    else v.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  else if (F && F.youtube) window.open(`https://youtu.be/${F.youtube}?t=${Math.floor(t)}`, "_blank");
}
const TACTIL = matchMedia("(hover: none), (pointer: coarse)").matches;
function avisoVideo() {
  let b = $("#ir-video");
  if (!b) {
    b = document.createElement("button");
    b.id = "ir-video"; b.type = "button";
    document.body.appendChild(b);
    b.addEventListener("click", () => {
      b.classList.remove("ver");
      $("#video").scrollIntoView({ behavior: "smooth", block: "center" });
    });
    // si el vídeo entra en la pantalla, el botón sobra
    if ("IntersectionObserver" in window)
      new IntersectionObserver(es => { if (es[0].intersectionRatio >= 0.6) b.classList.remove("ver"); },
        { threshold: [0.6] }).observe($("#video"));
  }
  b.textContent = "▶ " + T("p_video");
  b.classList.add("ver");
  clearTimeout(b._reloj);
  b._reloj = setTimeout(() => b.classList.remove("ver"), 4000);
}

const pc = n => n === 1 ? "var(--p1)" : n === 2 ? "var(--p2)" : "var(--gold)";
const pcl = n => n === 1 ? "var(--p1l)" : n === 2 ? "var(--p2l)" : "var(--gold)";
const nombre = n => (F.jugadores[n - 1] || {}).nombre || "";
const pct = (x, max) => Math.max(0, Math.min(100, max ? x * 100 / max : 0));

/* ---------------------------------------------------------------- cabecera */
function cabecera() {
  const [a, b] = F.jugadores, m = F.marcador || [0, 0];
  const g = m[0] === m[1] ? 0 : (m[0] > m[1] ? 1 : 2);
  const lado = (j, n) => `<div class="jug p${n}">
      ${retrato(j.clave, j.personaje)}
      <div class="datos">
        <div class="nom">${esc(j.nombre)}</div>
        <div class="sub">${bandera(j.pais, true)}${rango(j.rango_letra)}
          <span>${esc(j.personaje || "")}</span></div>
      </div></div>`;
  const nr = (F.peleas || []).reduce((x, p) => x + (p.rondas || []).length, 0);
  const datos = [F.ft ? "FT" + F.ft : "", (F.peleas || []).length + " " + pl((F.peleas || []).length, "u_pelea", "u_peleas"),
                 nr + " " + T("rondas_t").toLowerCase(), F.duracion ? mmss(F.duracion) : ""].filter(Boolean);
  return `<div class="cab">${lado(a, 1)}
    <div class="centro">
      <div class="marc"><span class="${g === 1 ? "g" : ""}">${m[0]}</span>–<span class="${g === 2 ? "g" : ""}">${m[1]}</span></div>
      ${g ? `<div class="gana-set" style="color:${pcl(g)}">${esc(nombre(g))} ${esc(T("r_gana_set"))}</div>`
          : `<div class="gana-set">${esc(T("empate"))}</div>`}
      <div class="res-datos">${datos.map(x => `<span>${esc(x)}</span>`).join("")}</div>
    </div>
    ${lado(b, 2)}</div>`;
}

/* ================================================================ CRITERIO VISUAL
   Cada dato sale UNA vez. La página habla del set, de una pelea o de una ronda con la
   MISMA tabla de estadísticas: sólo cambia el alcance. Nada de espejos (lo que hizo uno
   ya dice lo que recibió el otro) ni de la misma cifra en dos unidades.
   Colores fijos por jugador en toda la página: rojo el 1, azul el 2. */

// 1 si va por delante el jugador 1, 2 si el 2, 0 si van igual o no aplica.
// mejor: +1 cuanto más mejor, -1 cuanto menos mejor, 0 no hay "mejor".
const quienLidera = (na, nb, mejor = 1) => {
  if (!mejor || na == null || nb == null || na === nb) return 0;
  return (na > nb) === (mejor > 0) ? 1 : 2;
};

/* ================================================================ 2 · PELEAS
   Un set puede llegar a FT100: casi 200 peleas. La tira es el selector; debajo, SÓLO la
   pelea elegida: su marcador, la banda de rondas y sus momentos. */
let PELEA = Math.max(0, (parseInt(Q.get("pelea"), 10) || 1) - 1);

// rondas ganadas por cada uno EN esa pelea (no el marcador del set)
const rondasDe = p => {
  const r = [0, 0];
  (p.rondas || []).forEach(x => { if (x.ganador === 1 || x.ganador === 2) r[x.ganador - 1]++; });
  return r;
};
const durPelea = p => Math.max(0, (p.fin || p.t || 0) - (p.t || 0));

/* ---- carrusel: una fila que puede ser más larga que la pantalla (un FT100 tiene hasta
   ~200 peleas) con una flecha a cada lado que la desplaza. Si todo cabe, las flechas se
   quedan apagadas. */
const carrusel = (clase, dentro, etiqueta) => `<div class="carrusel">
    <button class="car-f" data-car="-1" aria-label="${esc(T("car_izq"))}" title="${esc(T("car_izq"))}" disabled>◀</button>
    <div class="car-pista ${clase}" role="tablist" aria-label="${esc(etiqueta)}">${dentro}</div>
    <button class="car-f" data-car="1" aria-label="${esc(T("car_der"))}" title="${esc(T("car_der"))}" disabled>▶</button></div>`;
function estadoCarruseles() {
  document.querySelectorAll(".carrusel").forEach(c => {
    const p = c.querySelector(".car-pista"), [a, b] = c.querySelectorAll(".car-f");
    if (!p) return;
    const max = p.scrollWidth - p.clientWidth;
    c.classList.toggle("desborda", max > 1);
    a.disabled = p.scrollLeft <= 1;
    b.disabled = p.scrollLeft >= max - 1;
  });
}
// deja a la vista, dentro de su carrusel, el elemento elegido (sin mover la página)
function aLaVista(el) {
  const p = el && el.closest(".car-pista");
  if (!p) return;
  const i = el.offsetLeft - p.offsetLeft, f = i + el.offsetWidth;
  if (i < p.scrollLeft) p.scrollLeft = i - 8;
  else if (f > p.scrollLeft + p.clientWidth) p.scrollLeft = f - p.clientWidth + 8;
}
addEventListener("resize", () => estadoCarruseles());
document.addEventListener("scroll", e => { if (e.target.classList && e.target.classList.contains("car-pista")) estadoCarruseles(); }, true);

// La pelea más corta que ganó cada uno lleva ⚡ en la tira (antes era una tarjeta aparte).
const rapidas = () => [1, 2].map(n => {
  const g = (F.peleas || []).filter(p => p.ganador === n && durPelea(p) > 0);
  return g.length ? g.reduce((a, p) => durPelea(p) < durPelea(a) ? p : a).n : null;
});

/* ---- la tira del set: cada pelea es un tramo tan ancho como lo que duró, del color
   de quien la ganó. Se entiende el set entero de un vistazo y se puede pulsar. */
function tiraSet() {
  const ps = F.peleas || [];
  if (!ps.length) return "";
  const rap = rapidas();
  const tot = ps.reduce((a, p) => a + Math.max(1, durPelea(p)), 0);
  const segs = ps.map((p, i) => {
    const w = Math.max(1, durPelea(p)) * 100 / tot;
    const r = rap.includes(p.n) && p.ganador ? `<span class="ts-rap" title="${esc(T("st_peleapida"))} · ${esc(nombre(p.ganador))}">⚡</span>` : "";
    return `<button class="ts-seg g${p.ganador || 0}" data-pelea="${i}" aria-pressed="${i === PELEA}"
      style="flex-grow:${w.toFixed(3)}"
      title="${esc(T("pelea"))} ${p.n} · ${esc(p.ganador ? nombre(p.ganador) : T("empate"))} · ${mmss(durPelea(p))}"
      ><b>${p.n}</b><span class="ts-r">${rondasDe(p).join("–")}</span>${r}</button>`;
  }).join("");
  return `<div class="tset${ps.length > 1 ? "" : " una"}">${carrusel("ts-bar", segs, T("s_peleas"))}</div>`;
}

/* ---- la línea de tiempo de TODO el set: las peleas como tramos y encima todos los
   momentos. Es el mando rápido del vídeo:
   · se pulsa un momento → el vídeo salta ahí (un par de segundos antes, para ver de dónde
     viene la jugada); se pulsa una pelea → la elige y el vídeo va a su inicio;
   · se pulsa cualquier otro punto de la línea → el vídeo va a ese segundo;
   · un cabezal dorado dice por dónde va el vídeo y la pelea que se está viendo lleva una
     raya dorada; con el ratón, una guía enseña el minuto que hay debajo.
   Si no caben las peleas o los momentos (un set largo, o el móvil), la línea se hace más
   ancha que la pantalla y se mueve con ◀ ▶, como la tira de peleas. Los filtros son
   leyenda: sin contadores, que ya están en las estadísticas. */
const ANTES = 2;                       // segundos de margen antes de cada momento
const LS_PELEA = 46, LS_SEG = 0.9;     // px mínimos por pelea y por segundo de vídeo
const hms = s => {
  s = Math.max(0, Math.round(s));
  return s < 3600 ? mmss(s)
    : Math.floor(s / 3600) + ":" + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
};
let LS = null;                         // {ini, fin, dur} de la línea pintada
let LS_TOCADO = 0;                     // cuándo movió la línea la persona (el cabezal no la pisa)
const chipsDe = moms => {
  const hay = new Set(moms.map(x => x.tipo));
  return TIPOS.filter(([tp]) => hay.has(tp)).map(([tp, forma]) =>
    `<button class="chip" data-tipo="${tp}" data-forma="${forma}" aria-pressed="${!APAGADOS.has(tp)}"${ESPECIAL.has(tp) ? ` style="--c:var(--gold)"` : ""}>
      <i></i>${esc(T(tp) || tp)}</button>`).join("");
};
function lineaSet() {
  const ps = F.peleas || [];
  if (!ps.length) { LS = null; return ""; }
  const ini = ps[0].t || 0, fin = Math.max(...ps.map(p => p.fin || p.t || 0), ini + 1), dur = fin - ini;
  LS = { ini, fin, dur };
  const X = t => pct(t - ini, dur);
  // ancho del lienzo: el de la caja, o más si así no caben las peleas o los momentos
  const caja = Math.max(200, (($("#tlset") && $("#tlset").clientWidth) || innerWidth) - 104);
  const minimo = Math.ceil(Math.max(ps.length * LS_PELEA, dur * LS_SEG));
  const W = Math.max(caja, minimo);
  const tramos = ps.map((p, i) => {
    const a = X(p.t || ini), b = X(p.fin || fin), r = rondasDe(p);
    const cabe = (b - a) * W / 100 >= String(p.n).length * 7 + 8;       // el número sólo si se lee
    return `<button class="ls-p g${p.ganador || 0}" data-pelea-t="${i}" data-t="${p.t}" aria-pressed="${i === PELEA}"
      style="left:${a}%;width:${Math.max(0.4, b - a)}%"
      title="${esc(T("pelea"))} ${p.n} · ${esc(p.ganador ? nombre(p.ganador) + " " + T("gana") : T("empate"))} ${r[0]}–${r[1]} · ${mmss(durPelea(p))}">${cabe ? `<span>${p.n}</span>` : ""}</button>`;
  }).join("");
  const moms = (F.momentos || []).filter(x => x.t >= ini && x.t <= fin).sort((a, b) => a.t - b.t);
  const FILAS = 4, HUECO = 13 * 100 / W, ult = Array(FILAS).fill(-99);   // 13 px entre momentos de una fila
  let usadas = 1;
  const puntos = moms.map(x => {
    const px = X(x.t);
    let f = ult.findIndex(u => px - u >= HUECO);
    if (f < 0) f = ult.indexOf(Math.min(...ult));
    ult[f] = px; usadas = Math.max(usadas, f + 1);
    return `<button class="tl-p${APAGADOS.has(x.tipo) ? " oculto" : ""}" data-tipo="${x.tipo}" data-t="${Math.max(0, x.t - ANTES)}"
      data-forma="${FORMA[x.tipo] || "circulo"}" style="left:${px}%;top:${4 + f * 13}px;--c:${colorMomento(x)}"
      title="${esc(T(x.tipo) || x.tipo)}${x.jugador ? " · " + esc(nombre(x.jugador)) : ""} · ${hms(x.t - ini)}"></button>`;
  }).join("");
  // marcas de tiempo: las justas para que no se pisen (al menos 72 px entre una y otra)
  const paso = [15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200].find(s => s * W / dur >= 72) || 7200;
  const marcas = [], guias = [];
  for (let s = 0; s <= dur + 0.01; s += paso) {
    marcas.push(`<span style="left:${pct(s, dur)}%">${hms(s)}</span>`);
    if (s > 0) guias.push(`<i class="tl-g" style="left:${pct(s, dur)}%"></i>`);
  }
  return `<section class="lset" id="linea" aria-label="${esc(T("linea"))}">
    <div class="tl-cab"><span class="tl-t">${esc(T("linea"))} · ${esc(T("s_set"))}</span><div class="chips">${chipsDe(moms)}</div></div>
    <div class="carrusel ls-car">
      <button class="car-f" data-car="-1" aria-label="${esc(T("car_izq"))}" title="${esc(T("car_izq"))}" disabled>◀</button>
      <div class="car-pista ls-pista">
        <div class="tl-caja ls-lienzo" style="width:${minimo > caja ? minimo + "px" : "calc(100% - 14px)"}">
          <div class="ls-peleas">${tramos}</div>
          <div class="tl-moms" style="height:${8 + usadas * 13}px">${guias.join("")}${puntos}</div>
          <div class="tl-eje">${marcas.join("")}</div>
          <i class="ls-cabezal" hidden></i><i class="ls-guia" hidden><b></b></i>
        </div>
      </div>
      <button class="car-f" data-car="1" aria-label="${esc(T("car_der"))}" title="${esc(T("car_der"))}" disabled>▶</button>
    </div></section>`;
}
// La pelea elegida queda marcada en la línea y a la vista dentro de ella (sólo se mueve la línea).
function lsElegida() {
  document.querySelectorAll(".ls-p").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.peleaT === PELEA)));
  const el = document.querySelector('.ls-p[aria-pressed="true"]'), p = el && el.closest(".ls-pista");
  if (!p || p.scrollWidth <= p.clientWidth + 1) return;
  const x = el.offsetLeft, w = el.offsetWidth;
  if (x < p.scrollLeft) p.scrollLeft = x - 12;
  else if (x + w > p.scrollLeft + p.clientWidth) p.scrollLeft = x + w - p.clientWidth + 12;
}
// Al cambiar el ancho de la ventana se rehace (las marcas y el ancho dependen de él), sin perder la posición.
let LS_ANCHO = innerWidth, LS_RELOJ = 0;
addEventListener("resize", () => {
  if (Math.abs(innerWidth - LS_ANCHO) < 2) return;     // en el móvil la barra del navegador también «redimensiona»
  LS_ANCHO = innerWidth;
  clearTimeout(LS_RELOJ);
  LS_RELOJ = setTimeout(() => {
    if (!F || !$("#tlset")) return;
    const p = $(".ls-pista"), f = p ? p.scrollLeft / Math.max(1, p.scrollWidth) : 0;
    $("#tlset").innerHTML = lineaSet();
    const q = $(".ls-pista");
    if (q) { q.style.scrollBehavior = "auto"; q.scrollLeft = f * q.scrollWidth; q.style.scrollBehavior = ""; }
    estadoCarruseles();
  }, 150);
});
// El cabezal: por dónde va el vídeo. Si el vídeo avanza y el cabezal se sale de la vista,
// la línea lo sigue, salvo que la persona la haya movido hace poco.
setInterval(() => {
  const cab = $(".ls-cabezal");
  if (!cab || !LS || !REPRO || !LISTO || typeof REPRO.getCurrentTime !== "function") return;
  const t = REPRO.getCurrentTime();
  const dentro = t >= LS.ini - 0.5 && t <= LS.fin + 0.5;
  cab.hidden = !dentro;
  const i = dentro ? (F.peleas || []).findIndex(p => t >= (p.t || 0) && t < (p.fin || p.t || 0)) : -1;
  document.querySelectorAll(".ls-p").forEach(b => b.classList.toggle("viendo", +b.dataset.peleaT === i));
  if (!dentro) return;
  cab.style.left = pct(t - LS.ini, LS.dur) + "%";
  const pista = cab.closest(".ls-pista");
  const va = typeof REPRO.getPlayerState === "function" && REPRO.getPlayerState() === 1;
  if (va && pista && pista.scrollWidth > pista.clientWidth + 1 && Date.now() - LS_TOCADO > 4000) {
    const x = cab.offsetLeft;
    if (x < pista.scrollLeft + 16 || x > pista.scrollLeft + pista.clientWidth - 16) pista.scrollLeft = x - pista.clientWidth * 0.25;
  }
}, 250);
// La guía del ratón: una raya fina con el minuto que hay debajo.
document.addEventListener("pointermove", e => {
  const g = $(".ls-guia");
  if (!g || !LS) return;
  const lien = e.pointerType === "mouse" && e.target.closest && e.target.closest(".ls-lienzo");
  if (!lien) { g.hidden = true; return; }
  const q = lien.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - q.left) / q.width));
  g.hidden = false;
  g.style.left = (f * 100) + "%";
  g.classList.toggle("izq", f > 0.9);
  g.firstChild.textContent = hms(f * LS.dur);
});
["wheel", "touchstart", "pointerdown"].forEach(ev => document.addEventListener(ev, e => {
  if (e.target.closest && e.target.closest(".ls-pista, .ls-car .car-f")) LS_TOCADO = Date.now();
}, { passive: true }));

/* ---- la pelea elegida: una banda de rondas en vez de tres tarjetas. Cada tramo lleva
   quién la ganó, cómo y cuánto duró; la barrita es la vida que le quedó al ganador (la del
   perdedor por KO siempre es 0 y sobraba). Pulsar una ronda = ver sus estadísticas. */
function pistaPelea(p) {
  const ini = p.t || 0, fin = p.fin || ini + 1, dur = Math.max(1, fin - ini);
  const X = t => pct(t - ini, dur);
  const rondas = (p.rondas || []).map((r, i) => {
    const a = X(r.t ?? ini), b = X(r.fin ?? fin), g = r.ganador || 0;
    const vida = g ? (r.vida_final || [])[g - 1] : null;
    const como = r.motivo === "time" ? T("por_tiempo") : r.motivo === "doble_ko" ? T("doble") : T("por_ko");
    const quien = g ? nombre(g) : T(r.motivo === "doble_ko" ? "doble" : "empate");
    const sellos = [];
    if (r.perfect) sellos.push(`<span class="tl-sello" title="${esc(T("perfect"))}">🏆</span>`);
    if (g && (r.remontada || 0) >= 50)
      sellos.push(`<span class="tl-sello" title="${esc(T("r_remontada").replace("%s", r.remontada))}">🔥 ${r.remontada}%</span>`);
    return `<button class="tl-r g${g}" data-ron="${i}" aria-pressed="${ALC === "ronda" && RON === i}" style="left:${a}%;width:${Math.max(0.6, b - a)}%"
      title="${esc(T("ronda"))} ${r.n} · ${esc(quien)} · ${esc(como)}${r.duracion ? " · " + r.duracion + " " + esc(T("seg_reloj")) : ""}${vida != null ? " · " + esc(T("vida_restante")) + " " + vida + "%" : ""}">
      <span class="tl-r1"><b>R${r.n}</b>${g ? `<span class="tl-rq">${esc(quien)}</span>` : ""}<span class="tl-rc${g ? "" : " sol"}">${esc(como)}${r.duracion ? " · " + r.duracion + "s" : ""}</span>${sellos.join("")}</span>
      <span class="tl-rv">${vida != null ? `<i style="width:${Math.max(0, Math.min(100, vida))}%"></i>` : ""}</span></button>`;
  }).join("");
  const moms = (F.momentos || []).filter(x => x.t >= ini && x.t <= fin).sort((a, b) => a.t - b.t);
  const FILAS = 3, HUECO = 2.2, ult = Array(FILAS).fill(-99);
  let usadas = 1;
  const puntos = moms.map(x => {
    const px = X(x.t);
    let f = ult.findIndex(u => px - u >= HUECO);
    if (f < 0) f = ult.indexOf(Math.min(...ult));
    ult[f] = px; usadas = Math.max(usadas, f + 1);
    return `<button class="tl-p${APAGADOS.has(x.tipo) ? " oculto" : ""}" data-tipo="${x.tipo}" data-t="${Math.max(0, x.t - ANTES)}"
      data-forma="${FORMA[x.tipo] || "circulo"}" style="left:${px}%;top:${4 + f * 14}px;--c:${colorMomento(x)}"
      title="${esc(T(x.tipo) || x.tipo)}${x.jugador ? " · " + esc(nombre(x.jugador)) : ""} · ${mmss(x.t)}"></button>`;
  }).join("");
  const paso = dur <= 90 ? 15 : dur <= 240 ? 30 : 60;
  const marcas = [], guias = [];
  for (let s = 0; s <= dur + 0.01; s += paso) {
    marcas.push(`<span style="left:${pct(s, dur)}%">${mmss(s)}</span>`);
    if (s > 0) guias.push(`<i class="tl-g" style="left:${pct(s, dur)}%"></i>`);
  }
  return `<div class="tl">
      <div class="tl-cab"><span class="tl-t">${esc(T("linea"))}</span><div class="chips">${chipsDe(moms)}</div></div>
      <div class="tl-caja">
        <div class="tl-rondas">${rondas}</div>
        <div class="tl-moms" style="height:${8 + usadas * 14}px">${guias.join("")}${puntos}</div>
        <div class="tl-eje">${marcas.join("")}</div>
      </div>
    </div>`;
}

/* ---- el detalle de la pelea elegida: el marcador y la banda. Sus cifras están en
   Estadísticas (alcance «Pelea N»), no repetidas aquí. */
function detallePelea() {
  const ps = F.peleas || [];
  const p = ps[PELEA];
  if (!p) return "";
  const r = rondasDe(p), g = p.ganador;
  const ron = ALC === "ronda" && p.rondas && p.rondas[RON];
  return `<div class="pdet">
    <div class="pd-cab">
      <button class="pd-nav" data-pelea="${PELEA - 1}"${PELEA === 0 ? " disabled" : ""} aria-label="${esc(T("p_ant"))}" title="${esc(T("p_ant"))}">◀</button>
      <span class="pd-n">${esc(T("pelea"))} <b>${p.n}</b><span>/${ps.length}</span></span>
      <div class="pd-duelo">
        <span class="pd-j a${g === 1 ? " gana" : g ? " pierde" : ""}">${g === 1 ? `<span class="pd-w">${esc(T("gana"))}</span>` : ""}<b>${esc(nombre(1))}</b><span class="pd-pj">${esc((p.personajes || [])[0] || "")}</span></span>
        <span class="pd-marc" title="${esc(T("rondas_t"))}"><span class="a">${r[0]}</span><i>–</i><span class="b">${r[1]}</span></span>
        <span class="pd-j b${g === 2 ? " gana" : g ? " pierde" : ""}"><span class="pd-pj">${esc((p.personajes || [])[1] || "")}</span><b>${esc(nombre(2))}</b>${g === 2 ? `<span class="pd-w">${esc(T("gana"))}</span>` : ""}</span>
      </div>
      <span class="pd-set" title="${esc(T("p_set_ayuda"))}">${esc(T("p_set"))} <b><span class="a">${(p.marcador || [0, 0])[0]}</span>–<span class="b">${(p.marcador || [0, 0])[1]}</span></b></span>
      <span class="pd-dur" title="${esc(T("s_tiempo"))}">${mmss(durPelea(p))}</span>
      ${F.youtube ? `<button class="pd-video" data-t="${ron ? ron.t : p.t}" title="${esc(T("p_video"))}">▶<span> ${esc(T("p_video"))}</span></button>` : ""}
      <button class="pd-nav" data-pelea="${PELEA + 1}"${PELEA >= ps.length - 1 ? " disabled" : ""} aria-label="${esc(T("p_sig"))}" title="${esc(T("p_sig"))}">▶</button>
    </div>
    ${pistaPelea(p)}
  </div>`;
}

function peleasYRondas() {
  return `<div class="sec-cab"><h2>${esc(T("s_peleas"))}</h2>${tiraSet()}</div>`
       + `<div id="pdet" class="pdet-caja">${detallePelea()}</div>`;
}

// Elegir una pelea: sólo se repinta su detalle y la tabla, no la página entera.
function eligePelea(i) {
  const ps = F.peleas || [];
  if (i < 0 || i >= ps.length || i === PELEA) return;
  PELEA = i; RON = 0;
  if (ALC === "ronda") ALC = "pelea";
  document.querySelectorAll("[data-pelea].ts-seg").forEach(b =>
    b.setAttribute("aria-pressed", String(+b.dataset.pelea === PELEA)));
  repintaDetalle(".ts-bar");
  aLaVista(document.querySelector('.ts-seg[aria-pressed="true"]'));
  lsElegida();
}

/* ================================================================ 3 · ESTADÍSTICAS
   UNA tabla. El alcance dice de qué parte habla: todo el set, la pelea elegida o una de
   sus rondas. Cada fila sabe sacar su valor en cada alcance; si ahí no existe, no sale.
   Con el set completo, «Por ronda» cambia los totales por medias (antes, pestaña Promedios).
   Las etiquetas caben en UNA línea en los seis idiomas; la unidad va entre paréntesis. */
let ALC = ["set", "pelea", "ronda"].includes(Q.get("ver")) ? Q.get("ver") : "set";
let RON = Math.max(0, (parseInt(Q.get("ronda"), 10) || 1) - 1);
let MODO = Q.get("modo") === "ronda" ? "media" : "total";

const GRUPOS = [["dano", "💥", "s_dano"], ["combos", "🔗", "s_combos"], ["super", "⚡", "s_supers"],
                ["mareos", "💫", "s_mareos"], ["rondas", "🥋", "rondas_t"]];

function filasEst() {
  const S = F.stats, J = F.jugadores, D = DATOS();
  // una barra = una vida entera; la escala la da la propia ficha (144 en Super Turbo)
  const BAR = S[0].dano && S[0].dano_barras ? S[0].dano / S[0].dano_barras : 144;
  const bar = v => (v / BAR).toFixed(2);
  const ent = v => milesDe(v);
  const dec = v => String(Math.round(v * 100) / 100);
  const uno = v => v.toFixed(1);
  const seg = v => v + " s";
  const pc = v => v + "%";
  const por = (v, n) => S[n].rondas_jugadas && v != null ? v / S[n].rondas_jugadas : null;
  const de = (k) => (p, n) => ((p.resumen || {})[k] || [])[n];
  const dr = (k) => (r, n) => (r[k] || [])[n];
  return [
    { g: "dano", k: "est_dano", set: n => S[n].dano, pel: de("dano"), ron: dr("dano"), f: bar, pts: true,
      med: n => por(S[n].dano, n), km: "est_dano_r" },
    { g: "dano", k: "est_golpes", set: n => S[n].golpes, f: ent, med: n => por(S[n].golpes, n), km: "est_golpes_r", fm: uno },
    { g: "dano", k: "est_golpe_max", set: n => S[n].golpe_max, f: bar, pts: true },
    { g: "dano", k: "est_por_golpe", med: n => S[n].dano_medio, f: bar, pts: true },
    ...(D.combos ? [
      { g: "combos", k: "s_combos", set: n => S[n].combos, pel: de("combos"), ron: dr("combos"), f: ent,
        med: n => por(S[n].combos, n), km: "est_combos_r", fm: dec },
      { g: "combos", k: "est_combo_max", set: n => S[n].combo_max, f: ent },
      { g: "combos", k: "est_combo_dano", set: n => S[n].combo_dano, f: bar, pts: true },
    ] : []),
    ...(D.super ? [
      { g: "super", k: "est_cargado", set: n => S[n].meter_full, f: ent },
      { g: "super", k: "est_supers", set: n => S[n].supers, pel: de("supers"), ron: dr("supers"), f: ent,
        med: n => por(S[n].supers, n), km: "est_supers_r", fm: dec },
    ] : []),
    ...(D.stun ? [
      { g: "mareos", k: "est_mareo", set: n => S[n].mareos, pel: de("mareos"), ron: dr("mareos"), f: ent },
      // lo cuenta quien mareó: el tiempo que el RIVAL pasó mareado
      { g: "mareos", k: "est_mareo_t", set: n => S[1 - n].stun_seg, f: seg },
      { g: "mareos", k: "est_mareo_max", set: n => S[1 - n].stun_peor_seg, f: seg },
    ] : []),
    { g: "rondas", k: "est_rondas", set: n => S[n].rondas, pel: (p, n) => rondasDe(p)[n], f: ent },
    { g: "rondas", k: "est_tiempo", set: n => S[n].timeup, f: ent },
    { g: "rondas", k: "est_perfects", set: n => S[n].perfects, pel: de("perfects"),
      ron: (r, n) => r.perfect && r.ganador === n + 1 ? 1 : 0, f: ent },
    { g: "rondas", k: "est_primero", set: n => S[n].primero, f: ent },
    { g: "rondas", k: "est_racha", set: n => S[n].racha, f: ent },
    { g: "rondas", k: "est_remontada", set: n => S[n].remontada, ron: (r, n) => r.ganador === n + 1 ? (r.remontada || 0) : null,
      f: pc, ay: "st_remontada" },
    { g: "rondas", k: "est_vida_m", kr: "est_vida", set: n => S[n].vida_al_ganar, med: n => S[n].vida_al_ganar,
      ron: (r, n) => r.ganador === n + 1 ? (r.vida_final || [])[n] : null, f: pc },
    { g: "rondas", k: "est_limite", set: n => S[n].al_limite, f: ent, ay: "st_limite" },
    { g: "rondas", k: "est_pelea_corta", set: n => S[n].pelea_rapida, f: mmss, mejor: -1 },
    { g: "rondas", k: "est_ronda_rapida", set: n => S[n].ronda_rapida, f: seg, mejor: -1, ay: "seg_reloj" },
    { g: "rondas", k: "est_dur_media", med: n => S[n].dur_avg, f: seg, mejor: 0, ay: "seg_reloj" },
    { g: "rondas", k: "est_pelea_media", med: n => peleaMedia(n + 1), f: mmss, mejor: 0 },
    { g: "rondas", k: "st_swaps", set: n => J[n].swaps, f: ent, mejor: 0 },
  ];
}
// Lo que tarda de media en ganar una pelea: sólo las peleas que GANÓ, en tiempo real.
function peleaMedia(n) {
  const ds = (F.peleas || []).filter(p => p.ganador === n).map(durPelea).filter(d => d > 0);
  return ds.length ? Math.round(ds.reduce((x, y) => x + y, 0) / ds.length) : null;
}

function panelEst() {
  const p = (F.peleas || [])[PELEA], r = p && (p.rondas || [])[RON];
  const media = ALC === "set" && MODO === "media";
  const valor = (f, n) => {
    if (ALC === "set") return media ? (f.med ? f.med(n) : undefined) : (f.set ? f.set(n) : undefined);
    if (ALC === "pelea") return f.pel && p ? f.pel(p, n) : undefined;
    return f.ron && r ? f.ron(r, n) : undefined;
  };
  const porG = {}, ceros = [];
  for (const f of filasEst()) {
    let a = valor(f, 0), b = valor(f, 1);
    if (a === undefined && b === undefined) continue;          // no existe en este alcance
    a = a ?? null; b = b ?? null;
    if (a == null && b == null) continue;
    const et = T(media && f.km ? f.km : ALC === "ronda" && f.kr ? f.kr : f.k);
    if (a === 0 && b === 0) { ceros.push(et); continue; }     // 0 · 0 va en una línea al pie
    const fmt = media && f.fm ? f.fm : f.f;
    const l = quienLidera(a, b, f.mejor === undefined ? 1 : f.mejor);
    const celda = (v, lado, lid) => `<b class="v ${lado}${lid ? " lid" : ""}"${f.pts && v != null
      ? ` title="${esc(milesDe(Math.round(v)))} ${esc(T("est_puntos"))}"` : ""}>${v == null ? "—" : esc(fmt(v))}</b>`;
    const ayuda = f.ay ? et + " · " + T(f.ay) : et;
    (porG[f.g] = porG[f.g] || []).push(`<div class="ef">${celda(a, "a", l === 1)}<span class="k" title="${esc(ayuda)}">${esc(et)}</span>${celda(b, "b", l === 2)}</div>`);
  }
  const J = F.jugadores;
  const sup = J[0].super || J[1].super
    ? `<i class="eg-sup"><span class="a">${esc(J[0].super || "—")}</span> · <span class="b">${esc(J[1].super || "—")}</span></i>` : "";
  const grupo = ([id, ic, t]) => porG[id] ? `<div class="eg"><div class="eg-t"><span class="eg-ic" aria-hidden="true">${ic}</span><span>${esc(T(t))}</span>${id === "super" ? sup : ""}</div>${porG[id].join("")}</div>` : "";
  const colA = GRUPOS.slice(0, 4).map(grupo).join(""), colB = grupo(GRUPOS[4]);
  const nom = `<div class="e-nom"><span class="a">${esc(nombre(1))}</span><span class="b">${esc(nombre(2))}</span></div>`;
  if (!colA && !colB) return `<div class="ecard"><p class="vacio">${esc(T("nada_aqui"))}</p></div>`;
  return `<div class="ecard"><div class="ecols">${colA ? `<div class="ecol">${nom}${colA}</div>` : ""}${colB ? `<div class="ecol">${nom}${colB}</div>` : ""}</div>`
    + (ceros.length ? `<p class="e-ceros">${esc(T("est_ceros"))}: ${ceros.map(esc).join(" · ")}</p>` : "") + `</div>`;
}

// las pastillas del alcance: 🌐 todo el set · 🥊 pelea N · R1 R2 R3 (subrayada con el color de quien la ganó)
function pastillas() {
  const p = (F.peleas || [])[PELEA];
  const b = (alc, txt, sel, extra = "", clase = "") =>
    `<button class="epill${clase}" data-alc="${alc}"${extra} aria-pressed="${sel}">${txt}</button>`;
  return b("set", `🌐 ${esc(T("est_set"))}`, ALC === "set")
    + (p ? b("pelea", `🥊 ${esc(T("pelea"))} ${p.n}`, ALC === "pelea") : "")
    + (p ? (p.rondas || []).map((r, i) => b("ronda", `R${r.n}`, ALC === "ronda" && RON === i, ` data-ron="${i}"`, ` g${r.ganador || 0}`)).join("") : "");
}
const modoEst = () => ALC !== "set" ? "" : `<div class="emodo" role="group">
    <button data-modo="total" aria-pressed="${MODO === "total"}">${esc(T("est_total"))}</button>
    <button data-modo="media" aria-pressed="${MODO === "media"}">${esc(T("est_media"))}</button></div>`;

function estadisticas() {
  return `<div class="sec-cab"><h2>${esc(T("est_titulo"))}</h2>
      <div class="epills" id="epills" role="group" aria-label="${esc(T("est_titulo"))}">${pastillas()}</div>
      <div id="emodo">${modoEst()}</div></div>
    <div id="epanel">${panelEst()}</div>`;
}

// Cambió la pelea, la ronda o el alcance: se repintan el detalle y la tabla sin mover la página.
function repintaDetalle(ancla) {
  sinSalto(() => {
    $("#pdet").innerHTML = detallePelea();
    $("#epills").innerHTML = pastillas();
    $("#emodo").innerHTML = modoEst();
    $("#epanel").innerHTML = panelEst();
  }, ancla);
  recuerdaUrl();
}

// La pelea y lo que se está mirando quedan en la dirección: se puede compartir tal cual.
function recuerdaUrl() {
  const u = new URL(location.href);
  u.searchParams.set("pelea", PELEA + 1);
  u.searchParams.delete("tema");
  if (ALC === "set") u.searchParams.delete("ver"); else u.searchParams.set("ver", ALC);
  if (ALC === "ronda") u.searchParams.set("ronda", RON + 1); else u.searchParams.delete("ronda");
  if (ALC === "set" && MODO === "media") u.searchParams.set("modo", "ronda"); else u.searchParams.delete("modo");
  history.replaceState(null, "", u);
}

function bloques() {
  return `<section id="peleas" class="fsec">${peleasYRondas()}</section>`
       + `<section id="estadisticas" class="fsec">${estadisticas()}</section>`;
}

function pinta() {
  document.documentElement.lang = LANG;
  textosCabecera(); pintaPie();
  pintaMiga();
  pintaApoyo();
  if (!F) { $("#cargando").textContent = T("no_existe"); return; }
  $("#cargando").hidden = true;

  $("#cab").innerHTML = cabecera();
  PELEA = Math.min(PELEA, Math.max(0, (F.peleas || []).length - 1));
  const pr = (F.peleas || [])[PELEA];
  if (ALC === "ronda" && !(pr && (pr.rondas || [])[RON])) { ALC = "pelea"; RON = 0; }
  $("#tlset").innerHTML = lineaSet();
  $("#resto").innerHTML = bloques();
  estadoCarruseles();
  aLaVista(document.querySelector('.ts-seg[aria-pressed="true"]'));
  lsElegida();

  if (!$("#video").dataset.hecho) {
    $("#video").dataset.hecho = "1";
    $("#video").innerHTML = F.youtube
      ? `<div class="reproductor"><div id="yt"></div></div>`
      : `<div class="avisovid"><b>${esc(T("no_publicado"))}</b><span>${esc(T("no_publicado_sub"))}</span></div>`;
    if (F.youtube) cargaApi().then(() => {
      if (!window.YT || !window.YT.Player || !document.getElementById("yt")) return;
      REPRO = new YT.Player("yt", { videoId: F.youtube, host: "https://www.youtube-nocookie.com",
        playerVars: { rel: 0, modestbranding: 1 },
        events: { onReady: () => { LISTO = true; } } });
    });
  } else if (!F.youtube) {
    $("#video").innerHTML = `<div class="avisovid"><b>${esc(T("no_publicado"))}</b><span>${esc(T("no_publicado_sub"))}</span></div>`;
  }
  document.title = `${F.jugadores[0].nombre} vs ${F.jugadores[1].nombre} · replayLab`;
}

// Un solo oyente para toda la página, puesto una vez: los botones se rehacen al cambiar
// de idioma, así que escuchar en el contenedor evita volver a engancharlos cada vez.
$("#cuerpo").addEventListener("click", e => {
  const chip = e.target.closest(".chip[data-tipo]");
  if (chip) {
    const t = chip.dataset.tipo;
    APAGADOS.has(t) ? APAGADOS.delete(t) : APAGADOS.add(t);
    document.querySelectorAll(".chip[data-tipo]").forEach(c =>
      c.setAttribute("aria-pressed", String(!APAGADOS.has(c.dataset.tipo))));
    document.querySelectorAll(".tl-p").forEach(m =>
      m.classList.toggle("oculto", APAGADOS.has(m.dataset.tipo)));
    return;
  }
  const flecha = e.target.closest("[data-car]");
  if (flecha) {
    if (flecha.closest(".ls-car")) LS_TOCADO = Date.now();
    const p = flecha.parentNode.querySelector(".car-pista");
    p.scrollBy({ left: +flecha.dataset.car * Math.max(120, p.clientWidth * 0.8), behavior: "smooth" });
    return;
  }
  // un punto cualquiera de la línea del set (fuera de peleas y momentos): el vídeo va a ese segundo
  const lien = e.target.closest(".ls-lienzo");
  if (lien && LS && !e.target.closest("button")) {
    const q = lien.getBoundingClientRect(), t = LS.ini + Math.max(0, Math.min(1, (e.clientX - q.left) / q.width)) * LS.dur;
    const i = (F.peleas || []).findIndex(p => t >= (p.t || 0) && t < (p.fin || p.t || 0));
    if (i >= 0) eligePelea(i);
    salta(t);
    return;
  }
  // alcance de las estadísticas: pastillas y tramos de la banda de rondas
  const alc = e.target.closest("[data-alc]");
  if (alc) {
    const nuevo = alc.dataset.alc, r = alc.dataset.ron != null ? +alc.dataset.ron : RON;
    if (nuevo === ALC && r === RON) return;
    ALC = nuevo; RON = r;
    repintaDetalle("#epills");
    return;
  }
  const ron = e.target.closest(".tl-r[data-ron]");
  if (ron) {
    const i = +ron.dataset.ron;
    if (ALC === "ronda" && RON === i) ALC = "pelea"; else { ALC = "ronda"; RON = i; }
    repintaDetalle(".ts-bar");      // .pdet entra con animación: el ancla va fuera
    return;
  }
  const modo = e.target.closest("[data-modo]");
  if (modo) {
    if (modo.dataset.modo === MODO) return;
    MODO = modo.dataset.modo;
    repintaDetalle("#epills");
    return;
  }
  const tramo = e.target.closest("[data-pelea-t]");
  if (tramo) { eligePelea(+tramo.dataset.peleaT); salta(parseFloat(tramo.dataset.t)); return; }
  const pel = e.target.closest("[data-pelea]");
  if (pel) { eligePelea(+pel.dataset.pelea); return; }
  const salto = e.target.closest("[data-t]");
  if (salto) salta(parseFloat(salto.dataset.t));
});

$("#cuerpo").addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const d = e.key === "ArrowRight" ? 1 : -1;
  if (e.target.closest(".ts-bar")) {
    e.preventDefault(); eligePelea(PELEA + d);
    const t = document.querySelector(`.ts-seg[data-pelea="${PELEA}"]`); if (t) t.focus();
  }
});

// La miga de pan: se sabe de qué juego es la partida por su gameid (datos/juegos.json).
function pintaMiga() {
  const el = $("#miga");
  if (!F) { el.innerHTML = `<a href="./">${esc(T("n_inicio"))}</a>`; return; }
  const j = juegoDe(F);
  const [a, b] = F.jugadores || [{}, {}];
  el.innerHTML = `<a href="./">${esc(T("n_inicio"))}</a><span>›</span>
    <a href="juegos.html">${esc(T("n_juegos"))}</a><span>›</span>
    ${j ? `<a href="${hrefJuego(j)}">${esc(j.corto)}</a><span>›</span>` : ""}
    <b>${esc(a.nombre || "")} vs ${esc(b.nombre || "")}</b>`;
}
montaCabecera("partidas", pinta);
$("#cargando").textContent = T("cargando");
const quark = (Q.get("q") || "").replace(/[^0-9A-Za-z_-]/g, "");
cargaBase(pinta);
json(`datos/${quark}.json`).then(d => { F = d; pinta(); }).catch(() => { F = null; pinta(); });
</script>
