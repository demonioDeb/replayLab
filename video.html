<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>replayLab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎮</text></svg>">
<link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
<header><div class="wrap hrow">
  <a class="logo" href="./">🎮 replay<b>Lab</b></a>
  <span class="sp"></span>
  <select id="idioma" aria-label="idioma"></select>
</div></header>

<main class="wrap">
  <a class="volver" href="./">← <span id="tvolver"></span></a>
  <div id="cuerpo"><p class="vacio" id="cargando"></p></div>
</main>

<footer class="wrap" id="pie"></footer>

<script src="assets/app.js"></script>
<script>
"use strict";
let F = null, REPRO = null, LISTO = false;

// Colores de los momentos de la línea de tiempo. Cada tipo tiene el suyo para que se
// lean de un vistazo sin tener que pasar el ratón por encima.
const COLOR = { combo:"#ffcb45", super:"#b06bff", mareo:"#7dfcb0", ko:"#ff5a5a",
                perfect:"#ffe58a", remontada:"#ff9a3d", doble_ko:"#ffffff" };
const ORDEN_MOMENTOS = ["ko", "combo", "super", "mareo", "perfect", "remontada", "doble_ko"];

/* El reproductor de YouTube se controla con su API para poder saltar al segundo de
   cada pelea y de cada momento. Si la API no carga (sin red, bloqueada), los botones
   siguen ahí pero sin efecto: la página no se rompe por eso. */
function cargaApi() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  return new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => res();
    document.head.appendChild(s);
    setTimeout(res, 6000);
  });
}
function salta(t) {
  if (REPRO && LISTO && REPRO.seekTo) { REPRO.seekTo(Math.max(0, t), true); REPRO.playVideo(); }
  else if (F && F.youtube) window.open(`https://youtu.be/${F.youtube}?t=${Math.floor(t)}`, "_blank");
}

function fila(k, a, b, enc) {
  return `<tr${enc ? ' class="enc"' : ""}><td class="a">${esc(a)}</td>
    <td class="k">${esc(k)}</td><td class="b">${esc(b)}</td></tr>`;
}
const dashSi = (v, suf) => (v === null || v === undefined || v === 0 || v === "") ? "—" : v + (suf || "");

function pinta() {
  document.documentElement.lang = LANG;
  $("#tvolver").textContent = T("volver");
  pintaPie($("#pie"));
  if (!F) { $("#cargando").textContent = T("no_existe"); return; }

  const [a, b] = F.jugadores, m = F.marcador || [0, 0], st = F.stats || [{}, {}];
  const gan = m[0] === m[1] ? 0 : (m[0] > m[1] ? 1 : 2);
  const dur = F.duracion || 1;

  const video = F.youtube
    ? `<div class="reproductor"><div id="yt"></div></div>`
    : `<div class="avisovid"><b>${esc(T("no_publicado"))}</b>
         <span>${esc(T("no_publicado_sub"))}</span></div>`;

  // pista: un tramo por pelea, y encima una marca por momento
  const tramos = (F.peleas || []).map((p, i) => {
    const ini = (p.t || 0) / dur * 100;
    const fin = ((p.fin || dur) / dur) * 100;
    return `<div class="pel" style="left:${ini}%;width:${Math.max(0, fin - ini)}%">
      ${esc(T("pelea"))} ${p.n}</div>`;
  }).join("");
  const marcas = (F.momentos || []).map(x => {
    const c = COLOR[x.tipo] || "#fff";
    const quien = x.jugador ? " · " + esc(F.jugadores[x.jugador - 1].nombre) : "";
    const dato = x.dato ? " " + x.dato : "";
    return `<button class="mk" style="left:${(x.t / dur) * 100}%;--c:${c}"
      data-t="${x.t}" title="${esc(T(x.tipo) || x.tipo)}${dato}${quien} — ${mmss(x.t)}"></button>`;
  }).join("");
  const leyenda = ORDEN_MOMENTOS.filter(t => (F.momentos || []).some(x => x.tipo === t))
    .map(t => `<span><i style="background:${COLOR[t]}"></i>${esc(T(t) || t)}</span>`).join("");

  // botones de salto: una pelea y sus rondas
  const saltos = (F.peleas || []).map(p => {
    const cab = `<button class="salto g${p.ganador || 0}" data-t="${p.t}">
      ${esc(T("pelea"))} ${p.n}<b>${mmss(p.t)}</b></button>`;
    const rr = (p.rondas || []).map(r => `<button class="salto g${r.ganador || 0}" data-t="${r.t}">
      ${esc(T("ronda"))} ${r.n}${r.perfect ? " ★" : ""}<b>${mmss(r.t)}</b></button>`).join("");
    return cab + rr;
  }).join("");

  const tabla = `<table class="st">
    ${fila("", a.personaje || "", b.personaje || "", true)}
    ${fila(T("st_peleas"), m[0], m[1])}
    ${fila(T("st_rondas"), st[0].rondas ?? 0, st[1].rondas ?? 0)}
    ${fila(T("st_kotiempo"), `${st[0].ko ?? 0} / ${st[0].timeup ?? 0}`, `${st[1].ko ?? 0} / ${st[1].timeup ?? 0}`)}
    ${fila(T("st_rapida"), dashSi(st[0].ronda_rapida, " " + T("seg")), dashSi(st[1].ronda_rapida, " " + T("seg")))}
    ${fila(T("st_vida"), dashSi(st[0].vida_al_ganar, "%"), dashSi(st[1].vida_al_ganar, "%"))}
    ${fila(T("st_limite"), st[0].al_limite ?? 0, st[1].al_limite ?? 0)}
    ${fila(T("st_remontada"), dashSi(st[0].remontada, "%"), dashSi(st[1].remontada, "%"))}
    ${fila(T("st_dano"), (st[0].dano_barras ?? 0) + " " + T("barras"), (st[1].dano_barras ?? 0) + " " + T("barras"))}
    ${fila(T("st_recibido"), (st[0].recibido_barras ?? 0) + " " + T("barras"), (st[1].recibido_barras ?? 0) + " " + T("barras"))}
    ${fila(T("st_combos"), st[0].combos ?? 0, st[1].combos ?? 0)}
    ${fila(T("st_combomax"), dashSi(st[0].combo_max, " " + T("golpes")), dashSi(st[1].combo_max, " " + T("golpes")))}
    ${fila(T("st_combodano"), dashSi(st[0].combo_dano_barras, " " + T("barras")), dashSi(st[1].combo_dano_barras, " " + T("barras")))}
    ${fila(T("st_supers"), st[0].supers ?? 0, st[1].supers ?? 0)}
    ${fila(T("st_perfects"), st[0].perfects ?? 0, st[1].perfects ?? 0)}
    ${fila(T("st_mareos"), st[0].mareos ?? 0, st[1].mareos ?? 0)}
  </table>`;

  $("#cuerpo").innerHTML = `
    <div class="cab">
      <div class="lado i"><div class="nom">${esc(bandera(a.pais))} ${esc(a.nombre)}</div>
        <div class="per">${esc(a.personaje || "")}</div></div>
      <div class="marc"><span class="${gan === 1 ? "g" : ""}">${m[0]}</span> –
        <span class="${gan === 2 ? "g" : ""}">${m[1]}</span></div>
      <div class="lado d"><div class="nom">${esc(b.nombre)} ${esc(bandera(b.pais))}</div>
        <div class="per">${esc(b.personaje || "")}</div></div>
    </div>
    ${video}
    <div class="linea"><h2>${esc(T("linea"))}</h2>
      <div class="pista">${tramos}${marcas}</div>
      <div class="leyenda">${leyenda}</div></div>
    <h2>${esc(T("saltos"))}</h2>
    <div class="saltos">${saltos}</div>
    <h2>${esc(T("resumen"))}</h2>
    ${tabla}`;

  document.querySelectorAll("[data-t]").forEach(el =>
    el.addEventListener("click", () => salta(parseFloat(el.dataset.t))));

  if (F.youtube && !REPRO) cargaApi().then(() => {
    if (!window.YT || !window.YT.Player || !document.getElementById("yt")) return;
    REPRO = new YT.Player("yt", { videoId: F.youtube, host: "https://www.youtube-nocookie.com",
      playerVars: { rel: 0, modestbranding: 1 },
      events: { onReady: () => { LISTO = true; } } });
  });
  document.title = `${a.nombre} vs ${b.nombre} · replayLab`;
}

montaIdiomas($("#idioma"), () => { const g = REPRO; pinta(); REPRO = g; });
$("#cargando").textContent = T("cargando");
const quark = (Q.get("q") || "").replace(/[^0-9A-Za-z_-]/g, "");
json(`datos/${quark}.json`).then(d => { F = d; pinta(); }).catch(() => { F = null; pinta(); });
</script>
</body>
</html>
