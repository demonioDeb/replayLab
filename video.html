<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎮</text></svg>">
<link rel="stylesheet" href="assets/estilo.css?v=52559c8f71">
</head>
<body>
<header id="cabsitio"></header>

<main class="wrap">
  <!-- Inicio › Juegos › el juego › la partida -->
  <nav class="miga" id="miga" aria-label="breadcrumb"></nav>
  <div id="cuerpo">
    <p class="vacio" id="cargando"></p>
    <div id="cab"></div>
    <div id="video"></div>
    <div id="resto"></div>
    <div id="apoyo"></div>
  </div>
</main>

<footer class="wrap" id="pie"></footer>

<script src="assets/app.js?v=e68b17f5f3"></script>
<script>
"use strict";
let F = null, REPRO = null, LISTO = false;

/* Cada tipo de momento con su color, para leerlos de un vistazo sin pasar el ratón.
   El orden es el de la leyenda y el de los filtros. */
const TIPOS = [
  ["ko",        "#ff5a5a"],
  ["combo",     "#ffcb45"],
  ["super",     "#b06bff"],
  ["mareo",     "#7dfcb0"],
  ["perfect",   "#ffe58a"],
  ["remontada", "#ff9a3d"],
  ["doble_ko",  "#ffffff"],
];
const COLOR = Object.fromEntries(TIPOS);
let APAGADOS = new Set();          // tipos de momento que el usuario ha ocultado

/* El reproductor se controla con la API de YouTube para poder saltar al segundo de
   cada pelea, ronda y momento. Si la API no carga, los botones abren el vídeo en una
   pestaña nueva con el segundo puesto: nunca se quedan sin hacer nada. */
function cargaApi() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  return new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => res();
    document.head.appendChild(s);
    setTimeout(res, 6000);
  });
}
function salta(t) {
  t = Math.max(0, t);
  if (REPRO && LISTO && REPRO.seekTo) { REPRO.seekTo(t, true); REPRO.playVideo(); }
  else if (F && F.youtube) window.open(`https://youtu.be/${F.youtube}?t=${Math.floor(t)}`, "_blank");
}

const pc = n => n === 1 ? "var(--p1)" : n === 2 ? "var(--p2)" : "var(--gold)";
const pcl = n => n === 1 ? "var(--p1l)" : n === 2 ? "var(--p2l)" : "var(--gold)";
const nombre = n => (F.jugadores[n - 1] || {}).nombre || "";
const pct = (x, max) => Math.max(0, Math.min(100, max ? x * 100 / max : 0));

/* ---------------------------------------------------------------- cabecera */
function cabecera() {
  const [a, b] = F.jugadores, m = F.marcador || [0, 0];
  const g = m[0] === m[1] ? 0 : (m[0] > m[1] ? 1 : 2);
  const lado = (j, n) => `<div class="jug p${n}">
      ${retrato(j.clave, j.personaje)}
      <div class="datos">
        <div class="nom">${esc(j.nombre)}</div>
        <div class="sub">${bandera(j.pais, true)}${rango(j.rango_letra)}
          <span>${esc(j.personaje || "")}</span></div>
      </div></div>`;
  const nr = (F.peleas || []).reduce((x, p) => x + (p.rondas || []).length, 0);
  const datos = [F.ft ? "FT" + F.ft : "", (F.peleas || []).length + " " + pl((F.peleas || []).length, "u_pelea", "u_peleas"),
                 nr + " " + T("rondas_t").toLowerCase(), F.duracion ? mmss(F.duracion) : ""].filter(Boolean);
  return `<div class="cab">${lado(a, 1)}
    <div class="centro">
      <div class="marc"><span class="${g === 1 ? "g" : ""}">${m[0]}</span>–<span class="${g === 2 ? "g" : ""}">${m[1]}</span></div>
      ${g ? `<div class="gana-set" style="color:${pcl(g)}">${esc(nombre(g))} ${esc(T("r_gana_set"))}</div>`
          : `<div class="gana-set">${esc(T("empate"))}</div>`}
      <div class="res-datos">${datos.map(x => `<span>${esc(x)}</span>`).join("")}</div>
    </div>
    ${lado(b, 2)}</div>`;
}

/* ================================================================ CRITERIO VISUAL
   No todo es una barra. Una barra sólo donde la longitud significa algo: aquí, la vida
   con la que termina cada ronda. Para lo demás, el número es el protagonista y la
   comparación se hace resaltando al que va por delante, no dibujando dos barras.
   Colores fijos por jugador en toda la página: rojo el 1, azul el 2. */

const lado = n => n === 1 ? "a" : "b";
// 1 si va por delante el jugador 1, 2 si el 2, 0 si van igual o no aplica.
// mejor: +1 cuanto más mejor, -1 cuanto menos mejor, 0 no hay "mejor" (un nombre, un rango).
const quienLidera = (na, nb, mejor = 1) => {
  if (!mejor || na == null || nb == null || na === nb) return 0;
  return (na > nb) === (mejor > 0) ? 1 : 2;
};

/* ---- comparación directa: sustituye a la vieja tabla con dos barras por fila.
   Misma forma de llamarla, así el cambio es igual en todas las secciones. */
function comparar(filas) {
  return `<div class="cmp">` + filas.map(([k, va, vb, na, nb, mejor, nota]) => {
    const l = quienLidera(na, nb, mejor === undefined ? 1 : mejor);
    return `<div class="cmp-f">
      <b class="v a${l === 1 ? " lid" : ""}">${va}</b>
      <span class="k">${esc(k)}${nota ? `<span class="nota">${esc(nota)}</span>` : ""}</span>
      <b class="v b${l === 2 ? " lid" : ""}">${vb}</b></div>`;
  }).join("") + `</div>`;
}
// cabecera de nombres para una tarjeta de comparación
const nombresCmp = () => `<div class="cmp-nom"><span class="a">${esc(nombre(1))}</span><span class="b">${esc(nombre(2))}</span></div>`;

const gu = (v, suf) => (v === null || v === undefined || v === 0 || v === "") ? "—" : esc(v) + (suf || "");
const n0 = v => milesDe(v ?? 0);
const pctTxt = s_ => s_.rondas_jugadas ? Math.round((s_.rondas || 0) * 100 / s_.rondas_jugadas) + "%" : "—";

/* ---- tarjeta de cifra grande (resumen): el número manda, la etiqueta acompaña */
function kpi(titulo, icono, na, nb, fmt, extra) {
  const l = quienLidera(na, nb);
  const d = Math.abs((na || 0) - (nb || 0));
  const dif = l ? `<span class="kpi-dif" style="--c:${pcl(l)}">+${fmt(d)} · ${esc(nombre(l))}</span>`
                : `<span class="kpi-dif igual">${esc(T("r_igual"))}</span>`;
  return `<div class="kpi">
    <span class="kpi-t">${icono ? icono + " " : ""}${esc(titulo)}</span>
    <div class="kpi-v"><b class="a${l === 1 ? " lid" : ""}">${fmt(na || 0)}</b><b class="b${l === 2 ? " lid" : ""}">${fmt(nb || 0)}</b></div>
    ${dif}${extra ? `<span class="kpi-x">${extra}</span>` : ""}</div>`;
}

/* ---- racha: secuencia de rondas, no una barra. ● ganada, ○ perdida, × nadie.
   La mejor racha va resaltada. */
function secuencia(n) {
  const rs = [];
  (F.peleas || []).forEach(p => (p.rondas || []).forEach(r => rs.push(r)));
  let mejor = [0, -1], cur = 0;
  rs.forEach((r, i) => {
    cur = r.ganador === n ? cur + 1 : 0;
    if (cur > mejor[0]) mejor = [cur, i];
  });
  const [lar, fin] = mejor;
  return `<span class="seq" style="--c:${pc(n)}">` + rs.map((r, i) => {
    const cls = r.ganador === n ? "g" : (r.ganador ? "p" : "x");
    const en = lar > 1 && i > fin - lar && i <= fin;
    return `<i class="${cls}${en ? " racha" : ""}"></i>`;
  }).join("") + `</span>`;
}

/* ================================================================ 1 · RESUMEN */
function resumen() {
  const [a, b] = F.stats;
  const barrasTxt = `≈ ${(a.dano_barras ?? 0).toFixed(1)} · ${(b.dano_barras ?? 0).toFixed(1)} ${esc(T("barras"))}`;
  const kpis = `<div class="kpis">
    ${kpi(T("s_dano"), "💥", a.dano, b.dano, n0, barrasTxt)}
    ${kpi(T("s_combos"), "🔗", a.combos, b.combos, n0)}
    ${kpi(T("s_supers"), "⚡", a.supers, b.supers, n0)}
    ${kpi(T("st_perfects"), "🏆", a.perfects, b.perfects, n0)}
  </div>`;

  // Momentos destacados: sólo lo que pasó de verdad. Si nadie remontó, no hay tarjeta
  // de remontada (el número sigue en Análisis).
  const dest = [];
  const tarjeta = (ic, t, v, sub, n) => dest.push(`<div class="dest" ${n ? `style="--c:${pc(n)}"` : ""}>
      <span class="dest-ic">${ic}</span><span class="dest-t">${esc(t)}</span>
      <b class="dest-v">${v}</b>${sub ? `<span class="dest-s">${sub}</span>` : ""}</div>`);
  if ((a.perfects || 0) + (b.perfects || 0))
    tarjeta("🏆", T("st_perfects"), `<span class="a">${a.perfects || 0}</span> · <span class="b">${b.perfects || 0}</span>`, "");
  if ((a.mareos || 0) + (b.mareos || 0))
    tarjeta("💫", T("st_dizzies"), `<span class="a">${a.mareos || 0}</span> · <span class="b">${b.mareos || 0}</span>`, "");
  const rem = (a.remontada || 0) >= (b.remontada || 0) ? 1 : 2, remv = F.stats[rem - 1].remontada || 0;
  if (remv >= 20)
    tarjeta("🔥", T("st_remontada"), esc(T("r_remontada").replace("%s", remv)), esc(nombre(rem)), rem);
  const rch = (a.racha || 0) >= (b.racha || 0) ? 1 : 2, rchv = F.stats[rch - 1].racha || 0;
  if (rchv > 1)
    tarjeta("🔗", T("st_racha"), secuencia(rch), esc(T("r_seguidas").replace("%s", rchv)) + " · " + esc(nombre(rch)), rch);
  const pr = [a.pelea_rapida, b.pelea_rapida];
  const prn = pr[0] && (!pr[1] || pr[0] <= pr[1]) ? 1 : (pr[1] ? 2 : 0);
  if (prn)
    tarjeta("⏱️", T("st_peleapida"), esc(mmss(pr[prn - 1])), esc(nombre(prn)), prn);

  return kpis + (dest.length ? `<h3 class="sub-t">${esc(T("r_destacados"))}</h3><div class="dests">${dest.join("")}</div>` : "");
}

/* ================================================================ 2 · PELEAS
   Un set puede llegar a FT100: casi 200 peleas. Desplegarlas todas hacía la página
   interminable. Ahora hay tres piezas: una tira con el set entero, la lista compacta de
   peleas, y el detalle SÓLO de la pelea elegida (su línea de tiempo y sus rondas). */
let PELEA = Math.max(0, (parseInt(Q.get("pelea"), 10) || 1) - 1);
const MUCHAS = 40;               // desde aquí la lista vive en una caja con scroll

// rondas ganadas por cada uno EN esa pelea (no el marcador del set)
const rondasDe = p => {
  const r = [0, 0];
  (p.rondas || []).forEach(x => { if (x.ganador === 1 || x.ganador === 2) r[x.ganador - 1]++; });
  return r;
};
const durPelea = p => Math.max(0, (p.fin || p.t || 0) - (p.t || 0));

/* ---- la tira del set: cada pelea es un tramo tan ancho como lo que duró, del color
   de quien la ganó. Se entiende el set entero de un vistazo y se puede pulsar. */
function tiraSet() {
  const ps = F.peleas || [];
  if (ps.length < 2) return "";
  const tot = ps.reduce((a, p) => a + Math.max(1, durPelea(p)), 0);
  const segs = ps.map((p, i) => {
    const w = Math.max(1, durPelea(p)) * 100 / tot;
    return `<button class="ts-seg g${p.ganador || 0}" data-pelea="${i}" aria-pressed="${i === PELEA}"
      style="flex-grow:${w.toFixed(3)}"
      title="${esc(T("pelea"))} ${p.n} · ${esc(p.ganador ? nombre(p.ganador) : T("empate"))} · ${mmss(durPelea(p))}"
      >${w > 3.5 ? p.n : ""}</button>`;
  }).join("");
  return `<div class="tset"><div class="ts-bar">${segs}</div>
    <div class="ts-eje"><span>${esc(T("pelea"))} 1</span><span>${esc(T("p_set_tl"))}</span>
      <span>${esc(T("pelea"))} ${ps[ps.length - 1].n}</span></div></div>`;
}

/* ---- la lista: una baldosa por pelea. Arriba el número, en medio las rondas de ESA
   pelea, abajo cómo iba el set después. El borde lleva el color del ganador. */
function listaPeleas() {
  const ps = F.peleas || [];
  const baldosas = ps.map((p, i) => {
    const r = rondasDe(p), m = p.marcador || [0, 0];
    return `<button class="pt g${p.ganador || 0}" data-pelea="${i}" aria-pressed="${i === PELEA}"
      title="${esc(T("pelea"))} ${p.n} · ${esc(p.ganador ? nombre(p.ganador) + " " + T("gana") : T("empate"))} · ${mmss(durPelea(p))}">
      <span class="pt-n">${p.n}</span>
      <span class="pt-r"><b class="a">${r[0]}</b><i>–</i><b class="b">${r[1]}</b></span>
      <span class="pt-s">${m[0]}–${m[1]}</span></button>`;
  }).join("");
  return `<div class="plist${ps.length > MUCHAS ? " muchas" : ""}" id="plist">${baldosas}</div>
    <p class="pley">${esc(T("p_ley"))}</p>`;
}

/* ---- la línea de tiempo de UNA pelea: un carril para las rondas, otro para los
   momentos y una regla de tiempo. Los momentos que caen casi en el mismo segundo se
   reparten en tres filas en vez de taparse unos a otros. */
function pistaPelea(p) {
  const ini = p.t || 0, fin = p.fin || ini + 1, dur = Math.max(1, fin - ini);
  const X = t => pct(t - ini, dur);
  const rondas = (p.rondas || []).map(r => {
    const a = X(r.t ?? ini), b = X(r.fin ?? fin);
    return `<button class="tl-r g${r.ganador ?? 0}" style="left:${a}%;width:${Math.max(0.6, b - a)}%"
      data-t="${r.t}" title="${esc(T("ronda"))} ${r.n} · ${mmss(r.t)}"><span>R${r.n}</span></button>`;
  }).join("");
  const moms = (F.momentos || []).filter(x => x.t >= ini && x.t <= fin).sort((a, b) => a.t - b.t);
  const cuenta = {};
  moms.forEach(x => { cuenta[x.tipo] = (cuenta[x.tipo] || 0) + 1; });
  const FILAS = 3, HUECO = 2.2, ult = Array(FILAS).fill(-99);
  let usadas = 1;
  const puntos = moms.map(x => {
    const px = X(x.t);
    let f = ult.findIndex(u => px - u >= HUECO);
    if (f < 0) f = ult.indexOf(Math.min(...ult));
    ult[f] = px; usadas = Math.max(usadas, f + 1);
    return `<button class="tl-p${APAGADOS.has(x.tipo) ? " oculto" : ""}" data-tipo="${x.tipo}" data-t="${x.t}"
      style="left:${px}%;top:${4 + f * 14}px;--c:${COLOR[x.tipo] || "#fff"}"
      title="${esc(T(x.tipo) || x.tipo)}${x.jugador ? " · " + esc(nombre(x.jugador)) : ""} · ${mmss(x.t)}"></button>`;
  }).join("");
  const paso = dur <= 90 ? 15 : dur <= 240 ? 30 : 60;
  const marcas = [], guias = [];
  for (let s = 0; s <= dur + 0.01; s += paso) {
    marcas.push(`<span style="left:${pct(s, dur)}%">${mmss(s)}</span>`);
    if (s > 0) guias.push(`<i class="tl-g" style="left:${pct(s, dur)}%"></i>`);
  }
  const chips = TIPOS.filter(([tp]) => cuenta[tp]).map(([tp, c]) =>
    `<button class="chip" data-tipo="${tp}" aria-pressed="${!APAGADOS.has(tp)}" style="--c:${c}">
      <i></i>${esc(T(tp) || tp)}<span class="n">${cuenta[tp]}</span></button>`).join("");
  return `<div class="tl">
      <div class="tl-cab"><span class="tl-t">${esc(T("linea"))}</span><div class="chips">${chips}</div></div>
      <div class="tl-caja">
        <div class="tl-rondas">${rondas}</div>
        <div class="tl-moms" style="height:${8 + usadas * 14}px">${guias.join("")}${puntos}</div>
        <div class="tl-eje">${marcas.join("")}</div>
      </div>
    </div>`;
}

/* ---- una ronda: la única barra de las estadísticas, la vida con la que acabó cada uno */
function tarjetaRonda(r) {
  const vf = r.vida_final || [null, null];
  const como = r.motivo === "time" ? T("por_tiempo") : r.motivo === "doble_ko" ? T("doble") : T("por_ko");
  const sellos = [];
  if (r.perfect) sellos.push([T("perfect"), COLOR.perfect]);
  if ((r.remontada || 0) >= 50) sellos.push([T("remontada"), COLOR.remontada]);
  if (r.ganador && vf[r.ganador - 1] === 0) sellos.push([T("r_cero"), "#ff9a3d", T("r_cero_ayuda")]);
  else if (r.ganador && vf[r.ganador - 1] != null && vf[r.ganador - 1] <= 10) sellos.push([T("al_limite"), "#ff9a3d"]);
  if (r.sin_cierre) sellos.push([T("sin_cierre"), "#7c8aa8", T("sin_cierre_ayuda")]);
  const vida = n => {
    const v = vf[n - 1];
    return `<div class="rv p${n}${r.ganador === n ? " gano" : ""}">
      <span class="rv-n">${esc(nombre(n))}</span>
      <span class="rv-b"><i style="width:${v == null ? 0 : Math.max(0, Math.min(100, v))}%"></i></span>
      <b class="rv-p">${v == null ? "—" : v + "%"}</b></div>`;
  };
  const d = r.dano || [0, 0];
  return `<button class="ronda${r.sin_cierre ? " abierta" : ""}" data-t="${r.t}" title="${mmss(r.t)}">
    <span class="r-cab"><span class="rn">${esc(T("ronda"))} ${r.n}</span>
      <span class="r-res">${r.ganador
        ? `<b style="color:${pcl(r.ganador)}">${esc(nombre(r.ganador))}</b>`
        : `<b style="color:var(--gold)">${esc(T(r.motivo === "doble_ko" ? "doble" : "empate"))}</b>`}
        <span class="r-como">${r.ganador ? esc(como) + " · " : ""}${r.duracion ? r.duracion + " " + esc(T("seg_reloj")) : ""}</span></span></span>
    ${vida(1)}${vida(2)}
    <span class="r-pie"><span class="r-dano">${esc(T("dano"))} <span class="a">${d[0]}</span> · <span class="b">${d[1]}</span></span>
      ${sellos.map(([t, c, ay]) => `<span class="sello" style="--c:${c}"${ay ? ` title="${esc(ay)}"` : ""}>${esc(t)}</span>`).join("")}</span>
  </button>`;
}

/* ---- el detalle de la pelea elegida */
function detallePelea() {
  const ps = F.peleas || [];
  const p = ps[PELEA];
  if (!p) return "";
  const r = rondasDe(p), res = p.resumen || {}, g = p.ganador;
  const mini = (k, par) => {
    const [a, b] = par || [0, 0], l = quienLidera(a, b);
    return `<div class="fm"><span class="fm-k">${esc(k)}</span>
      <span class="fm-v"><b class="a${l === 1 ? " lid" : ""}">${n0(a)}</b><b class="b${l === 2 ? " lid" : ""}">${n0(b)}</b></span></div>`;
  };
  const pf = res.perfects || [0, 0];
  return `<div class="pdet">
    <div class="pd-cab">
      <button class="pd-nav" data-pelea="${PELEA - 1}"${PELEA === 0 ? " disabled" : ""} aria-label="${esc(T("p_ant"))}" title="${esc(T("p_ant"))}">◀</button>
      <div class="pd-tit">
        <span class="pd-n">${esc(T("p_de").replace("%s", p.n).replace("%s", ps.length))}</span>
        <span class="pd-pj">${(p.personajes || []).map(esc).join(" vs ")}</span>
      </div>
      <div class="pd-res">
        ${g ? `<b style="color:${pcl(g)}">${esc(nombre(g))}</b><span>${esc(T("gana"))}</span>`
            : `<b style="color:var(--gold)">${esc(T("empate"))}</b>`}
        <span class="pd-marc"><span class="a">${r[0]}</span>–<span class="b">${r[1]}</span></span>
      </div>
      <button class="pd-nav" data-pelea="${PELEA + 1}"${PELEA >= ps.length - 1 ? " disabled" : ""} aria-label="${esc(T("p_sig"))}" title="${esc(T("p_sig"))}">▶</button>
    </div>
    <div class="fms">
      ${mini(T("s_dano"), res.dano)}${mini(T("s_combos"), res.combos)}${mini(T("s_supers"), res.supers)}
      ${mini(T("st_dizzies"), res.mareos)}${pf[0] + pf[1] ? mini(T("st_perfects"), pf) : ""}
      <div class="fm"><span class="fm-k">${esc(T("s_tiempo"))}</span><span class="fm-v"><b class="t">${mmss(durPelea(p))}</b></span></div>
      ${F.youtube ? `<button class="fm-video" data-t="${p.t}">▶ ${esc(T("p_video"))}</button>` : ""}
    </div>
    ${pistaPelea(p)}
    <div class="rondas-g">${(p.rondas || []).map(tarjetaRonda).join("")}</div>
  </div>`;
}

function peleasYRondas() {
  return tiraSet() + listaPeleas() + `<div id="pdet">${detallePelea()}</div>`;
}

// Elegir una pelea: sólo se repinta el detalle, no la página entera.
function eligePelea(i, desdeTeclado) {
  const ps = F.peleas || [];
  if (i < 0 || i >= ps.length || i === PELEA) return;
  PELEA = i;
  document.querySelectorAll("[data-pelea].pt, [data-pelea].ts-seg").forEach(b =>
    b.setAttribute("aria-pressed", String(+b.dataset.pelea === PELEA)));
  $("#pdet").innerHTML = detallePelea();
  enfocaBaldosa(desdeTeclado);
  recuerdaUrl();
}
// Con muchas peleas la lista es una caja con scroll: se mueve la caja, no la página.
function enfocaBaldosa(foco) {
  const caja = $("#plist"), el = caja && caja.querySelector(`.pt[data-pelea="${PELEA}"]`);
  if (!el) return;
  if (caja.classList.contains("muchas")) {
    const arriba = el.offsetTop - 6, abajo = el.offsetTop + el.offsetHeight + 6 - caja.clientHeight;
    if (caja.scrollTop > arriba) caja.scrollTop = arriba;
    else if (caja.scrollTop < abajo) caja.scrollTop = abajo;
  }
  if (foco) el.focus({ preventScroll: true });
}

/* ================================================================ 3 · ANÁLISIS
   Por temas, en pestañas: se ve UNO a la vez. Antes eran ocho tarjetas seguidas. */
let TEMA = "a-" + (Q.get("tema") || "rondas");
let TEMAS = [];
function pestanasAnalisis(lista) {
  TEMAS = lista;
  if (!TEMAS.some(t => t.id === TEMA)) TEMA = TEMAS[0].id;
  const tabs = TEMAS.map(t => `<button class="atab" role="tab" data-tema="${t.id}" aria-selected="${t.id === TEMA}">
      <span aria-hidden="true">${t.ic}</span> ${esc(t.titulo)}</button>`).join("");
  return `<div class="atabs" role="tablist">${tabs}</div><div class="apanel" id="apanel">${panelTema()}</div>`;
}
function panelTema() {
  const t = TEMAS.find(x => x.id === TEMA) || TEMAS[0];
  return `<div class="acard">${nombresCmp()}${t.html}</div>`;
}
function eligeTema(id) {
  if (id === TEMA || !TEMAS.some(t => t.id === id)) return;
  TEMA = id;
  document.querySelectorAll(".atab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tema === TEMA)));
  $("#apanel").innerHTML = panelTema();
  recuerdaUrl();
}

// La pelea y el tema elegidos quedan en la dirección: se puede compartir tal cual.
function recuerdaUrl() {
  const u = new URL(location.href);
  u.searchParams.set("pelea", PELEA + 1);
  u.searchParams.set("tema", TEMA.replace(/^a-/, ""));
  history.replaceState(null, "", u);
}

function analisis() {
  const [a, b] = F.stats, m = F.marcador || [0, 0];
  const [ja, jb] = F.jugadores;
  const seg = v => gu(v, " " + esc(T("seg")));
  // Las rondas se miden con el reloj del propio juego, que no son segundos reales
  // (en ST un segundo de reloj dura unos 0,6 s): se dice así en la unidad.
  const segR = v => gu(v, " " + esc(T("seg_reloj")));
  const bar = v => (v ?? 0).toFixed(1) + " " + esc(T("barras"));
  // cada tema es una pestaña; se ve uno a la vez
  const card = (id, ic, titulo, cuerpo, abierta, sub) =>
    ({ id, ic, titulo, html: cuerpo + (sub ? `<p class="nota-sec">${esc(sub)}</p>` : "") });
  // En la fila sólo la racha misma (● ● ● ● 4). La secuencia de toda la partida, con
  // la racha marcada, ya está en Momentos destacados; aquí 21 puntos no se leían.
  const racha = n => {
    const v = F.stats[n - 1].racha || 0;
    if (!v) return "—";
    return `<span class="seq" style="--c:${pc(n)}">${'<i class="g racha"></i>'.repeat(Math.min(v, 10))}</span><span class="seq-n">${v}</span>`;
  };

  const out = [];
  out.push(card("a-rondas", "🥋", T("s_set"), comparar([
    [T("st_peleas"), m[0], m[1], m[0], m[1]],
    [T("st_rondas"), `${a.rondas ?? 0} / ${a.rondas_jugadas ?? 0}`, `${b.rondas ?? 0} / ${b.rondas_jugadas ?? 0}`, a.rondas, b.rondas],
    [T("st_winpct"), pctTxt(a), pctTxt(b), a.rondas, b.rondas],
    [T("st_kotiempo"), `${a.ko ?? 0} / ${a.timeup ?? 0}`, `${b.ko ?? 0} / ${b.timeup ?? 0}`, a.ko, b.ko],
    [T("st_racha"), racha(1), racha(2), a.racha, b.racha],
    [T("st_limite"), a.al_limite ?? 0, b.al_limite ?? 0, a.al_limite, b.al_limite],
    [T("st_remontada"), gu(a.remontada, "%"), gu(b.remontada, "%"), a.remontada, b.remontada],
    [T("st_vida"), gu(a.vida_al_ganar, "%"), gu(b.vida_al_ganar, "%"), a.vida_al_ganar, b.vida_al_ganar],
    [T("st_perfects"), a.perfects ?? 0, b.perfects ?? 0, a.perfects, b.perfects],
  ]), true));
  out.push(card("a-dano", "💥", T("s_dano"), comparar([
    [T("st_dano"), n0(a.dano), n0(b.dano), a.dano, b.dano, 1, `≈ ${bar(a.dano_barras)} · ${bar(b.dano_barras)}`],
    [T("st_recibido"), n0(a.recibido), n0(b.recibido), a.recibido, b.recibido, -1],
    [T("st_vidaperd"), gu(a.vida_perdida_ronda, "%"), gu(b.vida_perdida_ronda, "%"), a.vida_perdida_ronda, b.vida_perdida_ronda, -1],
    [T("st_golpes"), a.golpes ?? 0, b.golpes ?? 0, a.golpes, b.golpes],
    [T("st_danomedio"), gu(a.dano_medio), gu(b.dano_medio), a.dano_medio, b.dano_medio],
  ]), true));
  out.push(card("a-combos", "🔗", T("s_combos"), comparar([
    [T("st_combos"), a.combos ?? 0, b.combos ?? 0, a.combos, b.combos],
    [T("st_combomax"), gu(a.combo_max, " " + esc(T("golpes"))), gu(b.combo_max, " " + esc(T("golpes"))), a.combo_max, b.combo_max],
    [T("st_combodano"), gu(a.combo_dano), gu(b.combo_dano), a.combo_dano, b.combo_dano, 1,
      a.combo_dano || b.combo_dano ? `≈ ${bar(a.combo_dano_barras)} · ${bar(b.combo_dano_barras)}` : ""],
  ]), true));
  out.push(card("a-supers", "⚡", T("s_supers"), comparar([
    [T("st_supers"), `⚡ ${a.supers ?? 0}`, `⚡ ${b.supers ?? 0}`, a.supers, b.supers],
    [T("st_meterfull"), gu(a.meter_full), gu(b.meter_full), a.meter_full, b.meter_full],
    [T("st_supernom"), esc(ja.super || "—"), esc(jb.super || "—"), 0, 0, 0],
  ]), true));
  out.push(card("a-mareos", "💫", T("s_mareos"), comparar([
    [T("st_dizzies"), a.mareos ?? 0, b.mareos ?? 0, a.mareos, b.mareos],
    [T("st_mareado"), gu(a.mareado_veces), gu(b.mareado_veces), a.mareado_veces, b.mareado_veces, -1],
    [T("st_stuntime"), seg(a.stun_seg), seg(b.stun_seg), a.stun_seg, b.stun_seg, -1],
    [T("st_stunpeor"), seg(a.stun_peor_seg), seg(b.stun_peor_seg), a.stun_peor_seg, b.stun_peor_seg, -1],
  ]), false));
  out.push(card("a-tiempo", "⏱️", T("s_tiempo"), comparar([
    [T("st_rapida"), segR(a.ronda_rapida), segR(b.ronda_rapida), a.ronda_rapida, b.ronda_rapida, -1],
    [T("st_peleapida"), a.pelea_rapida ? esc(mmss(a.pelea_rapida)) : "—", b.pelea_rapida ? esc(mmss(b.pelea_rapida)) : "—", a.pelea_rapida, b.pelea_rapida, -1],
    [T("st_duravg"), segR(a.dur_avg), segR(b.dur_avg), a.dur_avg, b.dur_avg, 0],
  ]) + graficaRondas(), false));
  const chars = j => esc((j.personajes || [j.personaje]).filter(Boolean).join(" · ") || "—");
  out.push(card("a-pers", "🎭", T("s_pers"), comparar([
    [T("s_pers"), chars(ja), chars(jb), 0, 0, 0],
    [T("rango"), esc(ja.rango_letra || "—"), esc(jb.rango_letra || "—"), 0, 0, 0],
    [T("st_swaps"), a.swaps ?? 0, b.swaps ?? 0, 0, 0, 0],
  ]), false));
  return pestanasAnalisis(out);
}

// Duración de cada ronda: aquí la barra compara magnitudes (cuánto duró cada una) y
// además sirve para saltar al vídeo. Va plegada dentro de Tiempo, no a la vista.
function graficaRondas() {
  const todas = [];
  (F.peleas || []).forEach(p => (p.rondas || []).forEach(r =>
    todas.push({ p: p.n, n: r.n, d: r.duracion || 0, g: r.ganador || 0, t: r.t })));
  if (!todas.length) return "";
  const max = Math.max(...todas.map(x => x.d)) || 1;
  return `<div class="durs"><div class="dtit">${esc(T("dur_rondas"))}</div>` + todas.map(x =>
    `<button class="dfila" data-t="${x.t}">
       <span class="et">${esc(T("pelea"))} ${x.p} · ${esc(T("ronda"))} ${x.n}</span>
       <span class="t"><i class="g${x.g}" style="width:${pct(x.d, max)}%"></i></span>
       <span class="v">${x.d} ${esc(T("seg_reloj"))}</span></button>`).join("") + "</div>";
}

const seccion = (id, titulo, cuerpo) => `<section id="${id}" class="fsec"><h2>${esc(titulo)}</h2>${cuerpo}</section>`;
function bloques() {
  return seccion("resumen", T("s_resumen"), resumen())
       + seccion("peleas", T("s_peleas"), peleasYRondas())
       + seccion("analisis", T("s_analisis"), analisis());
}

// Resultado → Resumen → Peleas → Análisis. La sección "Detalle técnico" (datos "del
// emulador") se quitó el 23 sep: no venían del emulador y no eran seguros.
const SECCIONES = [["resumen","s_resumen"],["peleas","s_peleas"],["analisis","s_analisis"]];
function navegacion() {
  return `<nav class="secnav">` + SECCIONES.map(([id, t]) => `<a href="#${id}">${esc(T(t))}</a>`).join("") + `</nav>`;
}

function pinta() {
  document.documentElement.lang = LANG;
  textosCabecera(); pintaPie();
  pintaMiga();
  pintaApoyo();
  if (!F) { $("#cargando").textContent = T("no_existe"); return; }
  $("#cargando").hidden = true;

  $("#cab").innerHTML = cabecera();
  PELEA = Math.min(PELEA, Math.max(0, (F.peleas || []).length - 1));
  $("#resto").innerHTML = navegacion() + bloques();
  enfocaBaldosa();

  if (!$("#video").dataset.hecho) {
    $("#video").dataset.hecho = "1";
    $("#video").innerHTML = F.youtube
      ? `<div class="reproductor"><div id="yt"></div></div>`
      : `<div class="avisovid"><b>${esc(T("no_publicado"))}</b><span>${esc(T("no_publicado_sub"))}</span></div>`;
    if (F.youtube) cargaApi().then(() => {
      if (!window.YT || !window.YT.Player || !document.getElementById("yt")) return;
      REPRO = new YT.Player("yt", { videoId: F.youtube, host: "https://www.youtube-nocookie.com",
        playerVars: { rel: 0, modestbranding: 1 },
        events: { onReady: () => { LISTO = true; } } });
    });
  } else if (!F.youtube) {
    $("#video").innerHTML = `<div class="avisovid"><b>${esc(T("no_publicado"))}</b><span>${esc(T("no_publicado_sub"))}</span></div>`;
  }
  document.title = `${F.jugadores[0].nombre} vs ${F.jugadores[1].nombre} · replayLab`;
}

// Un solo oyente para toda la página, puesto una vez: los botones se rehacen al cambiar
// de idioma, así que escuchar en el contenedor evita volver a engancharlos cada vez.
$("#cuerpo").addEventListener("click", e => {
  const chip = e.target.closest(".chip[data-tipo]");
  if (chip) {
    const t = chip.dataset.tipo;
    if (t === "__todo") APAGADOS.clear();
    else APAGADOS.has(t) ? APAGADOS.delete(t) : APAGADOS.add(t);
    document.querySelectorAll("#chips .chip").forEach(c => {
      if (c.dataset.tipo !== "__todo") c.setAttribute("aria-pressed", String(!APAGADOS.has(c.dataset.tipo)));
    });
    document.querySelectorAll(".tl-p").forEach(m =>
      m.classList.toggle("oculto", APAGADOS.has(m.dataset.tipo)));
    return;
  }
  const pel = e.target.closest("[data-pelea]");
  if (pel) { eligePelea(+pel.dataset.pelea); return; }
  const tema = e.target.closest("[data-tema]");
  if (tema) { eligeTema(tema.dataset.tema); return; }
  const salto = e.target.closest("[data-t]");
  if (salto) salta(parseFloat(salto.dataset.t));
});

$("#cuerpo").addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const d = e.key === "ArrowRight" ? 1 : -1;
  if (e.target.closest("#plist")) { e.preventDefault(); eligePelea(PELEA + d, true); }
  else if (e.target.closest(".atabs")) {
    e.preventDefault();
    const i = TEMAS.findIndex(t => t.id === TEMA) + d;
    if (TEMAS[i]) { eligeTema(TEMAS[i].id); document.querySelector(`.atab[data-tema="${TEMA}"]`).focus(); }
  }
});

// La miga de pan: se sabe de qué juego es la partida por su gameid (datos/juegos.json).
function pintaMiga() {
  const el = $("#miga");
  if (!F) { el.innerHTML = `<a href="./">${esc(T("n_inicio"))}</a>`; return; }
  const j = juegoDe(F);
  const [a, b] = F.jugadores || [{}, {}];
  el.innerHTML = `<a href="./">${esc(T("n_inicio"))}</a><span>›</span>
    <a href="juegos.html">${esc(T("n_juegos"))}</a><span>›</span>
    ${j ? `<a href="${hrefJuego(j)}">${esc(j.corto)}</a><span>›</span>` : ""}
    <b>${esc(a.nombre || "")} vs ${esc(b.nombre || "")}</b>`;
}
montaCabecera("partidas", pinta);
$("#cargando").textContent = T("cargando");
const quark = (Q.get("q") || "").replace(/[^0-9A-Za-z_-]/g, "");
cargaBase(pinta);
json(`datos/${quark}.json`).then(d => { F = d; pinta(); }).catch(() => { F = null; pinta(); });
</script>
