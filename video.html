<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>replayLab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎮</text></svg>">
<link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
<header><div class="wrap hrow">
  <a class="logo" href="./">🎮 replay<b>Lab</b></a>
  <span class="sp"></span>
  <select id="idioma" aria-label="idioma"></select>
</div></header>

<main class="wrap">
  <a class="volver" href="./">← <span id="tvolver"></span></a>
  <div id="cuerpo">
    <p class="vacio" id="cargando"></p>
    <div id="cab"></div>
    <div id="video"></div>
    <div id="resto"></div>
    <div id="apoyo"></div>
  </div>
</main>

<footer class="wrap" id="pie"></footer>

<script src="assets/app.js"></script>
<script>
"use strict";
let F = null, REPRO = null, LISTO = false;

/* Cada tipo de momento con su color, para leerlos de un vistazo sin pasar el ratón.
   El orden es el de la leyenda y el de los filtros. */
const TIPOS = [
  ["ko",        "#ff5a5a"],
  ["combo",     "#ffcb45"],
  ["super",     "#b06bff"],
  ["mareo",     "#7dfcb0"],
  ["perfect",   "#ffe58a"],
  ["remontada", "#ff9a3d"],
  ["doble_ko",  "#ffffff"],
];
const COLOR = Object.fromEntries(TIPOS);
let APAGADOS = new Set();          // tipos de momento que el usuario ha ocultado

/* El reproductor se controla con la API de YouTube para poder saltar al segundo de
   cada pelea, ronda y momento. Si la API no carga, los botones abren el vídeo en una
   pestaña nueva con el segundo puesto: nunca se quedan sin hacer nada. */
function cargaApi() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  return new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => res();
    document.head.appendChild(s);
    setTimeout(res, 6000);
  });
}
function salta(t) {
  t = Math.max(0, t);
  if (REPRO && LISTO && REPRO.seekTo) { REPRO.seekTo(t, true); REPRO.playVideo(); }
  else if (F && F.youtube) window.open(`https://youtu.be/${F.youtube}?t=${Math.floor(t)}`, "_blank");
}

const pc = n => n === 1 ? "var(--p1)" : n === 2 ? "var(--p2)" : "var(--gold)";
const pcl = n => n === 1 ? "var(--p1l)" : n === 2 ? "var(--p2l)" : "var(--gold)";
const nombre = n => (F.jugadores[n - 1] || {}).nombre || "";
const pct = (x, max) => Math.max(0, Math.min(100, max ? x * 100 / max : 0));

/* ---------------------------------------------------------------- cabecera */
function cabecera() {
  const [a, b] = F.jugadores, m = F.marcador || [0, 0];
  const g = m[0] === m[1] ? 0 : (m[0] > m[1] ? 1 : 2);
  const lado = (j, n) => `<div class="jug p${n}">
      ${retrato(j.clave, j.personaje)}
      <div class="datos">
        <div class="nom">${esc(j.nombre)}</div>
        <div class="sub">${bandera(j.pais, true)}${rango(j.rango_letra)}
          <span>${esc(j.personaje || "")}</span></div>
      </div></div>`;
  return `<div class="cab">${lado(a, 1)}
    <div class="marc"><span class="${g === 1 ? "g" : ""}">${m[0]}</span>–<span class="${g === 2 ? "g" : ""}">${m[1]}</span></div>
    ${lado(b, 2)}</div>`;
}

/* ---------------------------------------------------------------- línea de tiempo */
function lineaTiempo() {
  const peleas = F.peleas || [];
  const cuenta = {};
  (F.momentos || []).forEach(x => { cuenta[x.tipo] = (cuenta[x.tipo] || 0) + 1; });
  const usados = TIPOS.filter(([t]) => cuenta[t]);

  const chips = usados.map(([t, c]) => `<button class="chip" data-tipo="${t}"
      aria-pressed="${!APAGADOS.has(t)}" style="--c:${c}">
      <i></i>${esc(T(t) || t)}<span class="n">${cuenta[t]}</span></button>`).join("")
    + (usados.length > 1 ? `<button class="chip" data-tipo="__todo" aria-pressed="true">${esc(T("todo"))}</button>` : "");

  // Una pista POR PELEA, no una barra continua: antes iban pegadas y no se veía dónde
  // acababa una y empezaba la otra.
  const pistas = peleas.map(p => {
    const ini = p.t || 0, fin = p.fin || (ini + 1), dur = Math.max(0.1, fin - ini);
    const rondas = (p.rondas || []).map(r => {
      const a = pct((r.t || ini) - ini, dur), b = pct((r.fin || fin) - ini, dur);
      return `<button class="rd g${r.ganador ?? 0}" style="left:${a}%;width:${Math.max(0, b - a)}%"
        data-t="${r.t}" title="${esc(T("ronda"))} ${r.n} — ${mmss(r.t)}">${r.n}</button>`;
    }).join("");
    const marcas = (F.momentos || []).filter(x => x.t >= ini && x.t <= fin).map(x => {
      const quien = x.jugador ? " · " + esc(nombre(x.jugador)) : "";
      const dato = x.dato ? " " + x.dato : "";
      return `<button class="mk${APAGADOS.has(x.tipo) ? " oculto" : ""}" data-tipo="${x.tipo}"
        style="left:${pct(x.t - ini, dur)}%;--c:${COLOR[x.tipo] || "#fff"}" data-t="${x.t}"
        title="${esc(T(x.tipo) || x.tipo)}${dato}${quien} — ${mmss(x.t)}"></button>`;
    }).join("");
    const gan = p.ganador;
    return `<div class="pista">
      <span class="et"><b>${esc(T("pelea"))} ${p.n}</b>
        ${gan ? `<span style="color:${pcl(gan)}">${(p.marcador || []).join("-")}</span>` : ""}</span>
      <div class="barra" data-t="${ini}">${rondas}${marcas}</div>
      <span class="tot">${mmss(dur)}</span></div>`;
  }).join("");

  return `<h2>${esc(T("linea"))}<span class="sub">${esc(T("filtrar"))}</span></h2>
    <div class="chips" id="chips">${chips}</div>
    <div class="pistas">${pistas}</div>`;
}

/* ---------------------------------------------------------------- ronda a ronda */
function rondaAronda() {
  const vidaMax = 144;
  const bloques = (F.peleas || []).map(p => {
    const gan = p.ganador;
    const filas = (p.rondas || []).map(r => {
      const d = r.dano || [0, 0];
      const como = r.motivo === "time" ? T("por_tiempo") : r.motivo === "doble_ko" ? T("doble") : T("por_ko");
      const sellos = [];
      if (r.perfect) sellos.push(["perfect", COLOR.perfect]);
      if ((r.remontada || 0) >= 50) sellos.push(["remontada", COLOR.remontada]);
      if (r.motivo === "doble_ko") sellos.push(["doble_ko", COLOR.doble_ko]);
      if (r.vida_fin !== null && r.vida_fin !== undefined && r.vida_fin <= 10 && r.ganador)
        sellos.push(["al_limite", "#ff9a3d"]);
      // Una sola barra que crece desde el centro hacia cada lado. Dos barras pegadas
      // una encima de otra parecían una sola raya y no se entendía de quién era cada
      // mitad; así se ve de un vistazo quién pegó más en esa ronda.
      const tit = `${esc(T("dano_ronda"))}: ${esc(nombre(1))} ${(d[0] / vidaMax).toFixed(1)} · ${esc(nombre(2))} ${(d[1] / vidaMax).toFixed(1)} ${esc(T("barras"))}`;
      return `<div class="rfila${r.sin_cierre ? " abierta" : ""}" data-t="${r.t}" title="${mmss(r.t)}">
        <span class="rn">${esc(T("ronda"))} <b>${r.n}</b></span>
        <span class="tug" title="${tit}">
          <span class="lado a"><span class="v">${(d[0] / vidaMax).toFixed(1)}</span>
            <span class="t"><i style="width:${pct(d[0], vidaMax)}%"></i></span></span>
          <span class="eje"></span>
          <span class="lado b"><span class="t"><i style="width:${pct(d[1], vidaMax)}%"></i></span>
            <span class="v">${(d[1] / vidaMax).toFixed(1)}</span></span></span>
        <span class="como">${r.ganador
            ? `<b style="color:${pcl(r.ganador)}">${esc(nombre(r.ganador))}</b> <span style="color:var(--dim)">· ${esc(como)}${r.vida_fin ? ` · ${r.vida_fin}%` : ""}</span>`
            : `<b style="color:var(--gold)">${esc(T("empate"))}</b>`}</span>
        <span class="dur">${r.duracion ? r.duracion + " " + T("seg") : "—"}</span>
        <span class="sellos">${sellos.map(([k, c]) =>
            `<span class="sello" style="--c:${c}">${esc(T(k) || k)}</span>`).join("")}
          ${r.sin_cierre ? `<span class="sello" style="--c:#7c8aa8" title="${esc(T("sin_cierre_ayuda"))}">${esc(T("sin_cierre"))}</span>` : ""}</span>
      </div>`;
    }).join("");
    return `<div class="gcard">
      <div class="gh"><span class="t">${esc(T("pelea"))} ${p.n}</span>
        <span style="color:var(--dim);font-size:14px">${(p.personajes || []).map(esc).join(" vs ")}</span>
        ${gan ? `<span class="gana" style="color:${pcl(gan)}">${esc(nombre(gan))} ${esc(T("gana"))}</span>` : ""}
        <span class="res">${(p.marcador || []).join(" – ")}</span></div>
      ${filas}</div>`;
  }).join("");
  return `<h2>${esc(T("resumen_rondas"))}<span class="sub">
      <span style="color:var(--p1l)">◀ ${esc(nombre(1))}</span> ·
      ${esc(T("dano"))} (${esc(T("barras"))}) ·
      <span style="color:var(--p2l)">${esc(nombre(2))} ▶</span></span></h2>
    <div class="rondas">${bloques}</div>`;
}

/* ---------------------------------------------------------------- bloques de datos */
/* Una tabla comparativa con indicador. `nb` marca si el número grande es mejor: sirve
   para que la barra diga de un vistazo quién va por delante en esa fila. */
function tabla(filas) {
  const fila = (k, va, vb, na, nb, nota) => {
    const max = Math.max(Math.abs(na || 0), Math.abs(nb || 0)) || 1;
    return `<tr><td class="ia"><span class="ind"><i style="width:${pct(Math.abs(na || 0), max)}%"></i></span></td>
      <td class="a">${esc(String(va))}</td>
      <td class="k">${esc(k)}${nota ? `<span class="nota">${esc(nota)}</span>` : ""}</td>
      <td class="b">${esc(String(vb))}</td>
      <td class="ib"><span class="ind"><i style="width:${pct(Math.abs(nb || 0), max)}%"></i></span></td></tr>`;
  };
  return `<table class="st">
    <tr class="enc"><td class="ia"></td><td class="a">${esc(F.jugadores[0].personaje || "")}</td>
      <td class="k">${esc(F.jugadores[0].nombre)} \u00b7 ${esc(F.jugadores[1].nombre)}</td>
      <td class="b">${esc(F.jugadores[1].personaje || "")}</td><td class="ib"></td></tr>
    ${filas.map(f => fila(...f)).join("")}</table>`;
}
const gu = (v, suf) => (v === null || v === undefined || v === 0 || v === "") ? "\u2014" : v + (suf || "");
const seccion = (id, titulo, cuerpo, sub) =>
  `<section id="${id}"><h2>${esc(titulo)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</h2>${cuerpo}</section>`;

function bloques() {
  const [a, b] = F.stats, m = F.marcador || [0, 0];
  const [ja, jb] = F.jugadores;
  const barras = v => (v ?? 0) + " " + T("barras");
  const seg = v => gu(v, " " + T("seg"));
  const out = [];

  // 1 · el set: sólo lo que explica el resultado
  out.push(seccion("set", T("s_set"), tabla([
    [T("st_peleas"), m[0], m[1], m[0], m[1]],
    [T("st_rondas"), `${a.rondas ?? 0} / ${a.rondas_jugadas ?? 0}`, `${b.rondas ?? 0} / ${b.rondas_jugadas ?? 0}`, a.rondas, b.rondas],
    [T("st_winpct"), pctTxt(a), pctTxt(b), a.rondas, b.rondas],
    [T("st_kotiempo"), `${a.ko ?? 0} / ${a.timeup ?? 0}`, `${b.ko ?? 0} / ${b.timeup ?? 0}`, a.ko, b.ko],
    [T("st_racha"), gu(a.racha), gu(b.racha), a.racha, b.racha],
    [T("st_limite"), a.al_limite ?? 0, b.al_limite ?? 0, a.al_limite, b.al_limite],
    [T("st_remontada"), gu(a.remontada, "%"), gu(b.remontada, "%"), a.remontada, b.remontada],
    [T("st_vida"), gu(a.vida_al_ganar, "%"), gu(b.vida_al_ganar, "%"), a.vida_al_ganar, b.vida_al_ganar],
    [T("st_perfects"), a.perfects ?? 0, b.perfects ?? 0, a.perfects, b.perfects],
    [T("st_peleapida"), seg(a.pelea_rapida), seg(b.pelea_rapida), a.pelea_rapida ? 1 / a.pelea_rapida : 0, b.pelea_rapida ? 1 / b.pelea_rapida : 0],
  ])));

  // 2 · pelea por pelea
  out.push(seccion("peleas", T("s_peleas"), rondaAronda()));

  // 3 · daño
  out.push(seccion("dano", T("s_dano"), tabla([
    [T("st_dano"), barras(a.dano_barras), barras(b.dano_barras), a.dano, b.dano],
    [T("st_recibido"), barras(a.recibido_barras), barras(b.recibido_barras), a.recibido, b.recibido],
    [T("st_vidaperd"), gu(a.vida_perdida_ronda, "%"), gu(b.vida_perdida_ronda, "%"), a.vida_perdida_ronda, b.vida_perdida_ronda],
    [T("st_golpes"), a.golpes ?? 0, b.golpes ?? 0, a.golpes, b.golpes],
    [T("st_danomedio"), gu(a.dano_medio), gu(b.dano_medio), a.dano_medio, b.dano_medio],
    [T("st_agarres"), a.agarres ?? 0, b.agarres ?? 0, a.agarres, b.agarres],
  ])));

  // 4 · combos
  out.push(seccion("combos", T("s_combos"), tabla([
    [T("st_combos"), a.combos ?? 0, b.combos ?? 0, a.combos, b.combos],
    [T("st_combomax"), gu(a.combo_max, " " + T("golpes")), gu(b.combo_max, " " + T("golpes")), a.combo_max, b.combo_max],
    [T("st_combodano"), gu(a.combo_dano_barras, " " + T("barras")), gu(b.combo_dano_barras, " " + T("barras")), a.combo_dano, b.combo_dano],
  ])));

  // 5 · súpers
  out.push(seccion("supers", T("s_supers"), tabla([
    [T("st_supers"), a.supers ?? 0, b.supers ?? 0, a.supers, b.supers],
    [T("st_meterfull"), gu(a.meter_full), gu(b.meter_full), a.meter_full, b.meter_full],
    [T("st_supernom"), ja.super || "\u2014", jb.super || "\u2014", 0, 0],
  ])));

  // 6 · mareos
  out.push(seccion("mareos", T("s_mareos"), tabla([
    [T("st_dizzies"), a.mareos ?? 0, b.mareos ?? 0, a.mareos, b.mareos],
    [T("st_mareado"), gu(a.mareado_veces), gu(b.mareado_veces), a.mareado_veces, b.mareado_veces],
    [T("st_stuntime"), gu(a.stun_seg, " " + T("seg")), gu(b.stun_seg, " " + T("seg")), a.stun_seg, b.stun_seg],
    [T("st_stunpeor"), gu(a.stun_peor_seg, " " + T("seg")), gu(b.stun_peor_seg, " " + T("seg")), a.stun_peor_seg, b.stun_peor_seg],
  ])));

  // 7 · tiempo, con la duración de cada ronda
  out.push(seccion("tiempo", T("s_tiempo"), tabla([
    [T("st_rapida"), seg(a.ronda_rapida), seg(b.ronda_rapida), a.ronda_rapida ? 1 / a.ronda_rapida : 0, b.ronda_rapida ? 1 / b.ronda_rapida : 0],
    [T("st_duravg"), seg(a.dur_avg), seg(b.dur_avg), a.dur_avg, b.dur_avg],
  ]) + graficaRondas()));

  // 8 · defensa: sólo si la grabación lleva la sonda que lo permite medir
  if (a.verificado) {
    out.push(seccion("defensa", T("s_def"), tabla([
      [T("st_conect"), a.conectados ?? 0, b.conectados ?? 0, a.conectados, b.conectados],
      [T("st_bloq"), a.bloqueados ?? 0, b.bloqueados ?? 0, a.bloqueados, b.bloqueados],
      [T("st_bloqueo"), a.bloqueo ?? 0, b.bloqueo ?? 0, a.bloqueo, b.bloqueo],
      [T("st_defensa"), gu(a.defensa, "%"), gu(b.defensa, "%"), a.defensa, b.defensa],
      [T("st_primero"), a.primer_golpe ? "\u2713" : "\u2014", b.primer_golpe ? "\u2713" : "\u2014", a.primer_golpe, b.primer_golpe],
    ])));
  }

  // 9 · personajes
  const chars = j => (j.personajes || [j.personaje]).filter(Boolean).join(" \u00b7 ") || "\u2014";
  out.push(seccion("personajes", T("s_pers"), tabla([
    ["", chars(ja), chars(jb), 0, 0],
    [T("rango"), ja.rango_letra || "\u2014", jb.rango_letra || "\u2014", 0, 0],
    [T("st_swaps"), a.swaps ?? 0, b.swaps ?? 0, a.swaps, b.swaps],
  ])));

  // 10 · lo que dice el emulador, separado de lo que calcula replayLab
  out.push(seccion("emulador", T("s_emu"), tabla([
    [T("st_dano"), barras(a.emu_dano_barras), barras(b.emu_dano_barras), a.emu_dmg, b.emu_dmg],
    [T("st_golpes"), a.emu_hits ?? 0, b.emu_hits ?? 0, a.emu_hits, b.emu_hits],
    [T("st_agarres"), a.emu_throws ?? 0, b.emu_throws ?? 0, a.emu_throws, b.emu_throws],
    [T("st_bloqueo"), a.emu_blocked ?? 0, b.emu_blocked ?? 0, a.emu_blocked, b.emu_blocked],
  ]), T("emu_nota")));

  return out.join("");
}

const pctTxt = s_ => s_.rondas_jugadas ? Math.round((s_.rondas || 0) * 100 / s_.rondas_jugadas) + "%" : "\u2014";

// Duración de cada ronda del set, en una barra por ronda: se ve el ritmo de un vistazo.
function graficaRondas() {
  const todas = [];
  (F.peleas || []).forEach(p => (p.rondas || []).forEach(r =>
    todas.push({ p: p.n, n: r.n, d: r.duracion || 0, g: r.ganador || 0, t: r.t })));
  if (!todas.length) return "";
  const max = Math.max(...todas.map(x => x.d)) || 1;
  return `<div class="durs"><div class="dtit">${esc(T("dur_rondas"))}</div>` + todas.map(x =>
    `<button class="dfila" data-t="${x.t}">
       <span class="et">${esc(T("pelea"))} ${x.p} \u00b7 ${esc(T("ronda"))} ${x.n}</span>
       <span class="t"><i class="g${x.g}" style="width:${pct(x.d, max)}%"></i></span>
       <span class="v">${x.d} ${esc(T("seg"))}</span></button>`).join("") + "</div>";
}

const SECCIONES = [["set","s_set"],["peleas","s_peleas"],["dano","s_dano"],["combos","s_combos"],
  ["supers","s_supers"],["mareos","s_mareos"],["tiempo","s_tiempo"],["defensa","s_def"],
  ["personajes","s_pers"],["emulador","s_emu"]];
function navegacion() {
  const hay = id => id !== "defensa" || (F.stats[0] || {}).verificado;
  return `<nav class="secnav">` + SECCIONES.filter(([id]) => hay(id))
    .map(([id, t]) => `<a href="#${id}">${esc(T(t))}</a>`).join("") + `</nav>`;
}

function pinta() {
  document.documentElement.lang = LANG;
  $("#tvolver").textContent = T("volver");
  pintaPie($("#pie"));
  pintaApoyo();
  if (!F) { $("#cargando").textContent = T("no_existe"); return; }
  $("#cargando").hidden = true;

  $("#cab").innerHTML = cabecera();
  $("#resto").innerHTML = lineaTiempo() + navegacion() + bloques();

  if (!$("#video").dataset.hecho) {
    $("#video").dataset.hecho = "1";
    $("#video").innerHTML = F.youtube
      ? `<div class="reproductor"><div id="yt"></div></div>`
      : `<div class="avisovid"><b>${esc(T("no_publicado"))}</b><span>${esc(T("no_publicado_sub"))}</span></div>`;
    if (F.youtube) cargaApi().then(() => {
      if (!window.YT || !window.YT.Player || !document.getElementById("yt")) return;
      REPRO = new YT.Player("yt", { videoId: F.youtube, host: "https://www.youtube-nocookie.com",
        playerVars: { rel: 0, modestbranding: 1 },
        events: { onReady: () => { LISTO = true; } } });
    });
  } else if (!F.youtube) {
    $("#video").innerHTML = `<div class="avisovid"><b>${esc(T("no_publicado"))}</b><span>${esc(T("no_publicado_sub"))}</span></div>`;
  }
  document.title = `${F.jugadores[0].nombre} vs ${F.jugadores[1].nombre} · replayLab`;
}

// Un solo oyente para toda la página, puesto una vez: los botones se rehacen al cambiar
// de idioma, así que escuchar en el contenedor evita volver a engancharlos cada vez.
$("#cuerpo").addEventListener("click", e => {
  const chip = e.target.closest(".chip[data-tipo]");
  if (chip) {
    const t = chip.dataset.tipo;
    if (t === "__todo") APAGADOS.clear();
    else APAGADOS.has(t) ? APAGADOS.delete(t) : APAGADOS.add(t);
    document.querySelectorAll("#chips .chip").forEach(c => {
      if (c.dataset.tipo !== "__todo") c.setAttribute("aria-pressed", String(!APAGADOS.has(c.dataset.tipo)));
    });
    document.querySelectorAll(".mk").forEach(m =>
      m.classList.toggle("oculto", APAGADOS.has(m.dataset.tipo)));
    return;
  }
  const salto = e.target.closest("[data-t]");
  if (salto) salta(parseFloat(salto.dataset.t));
});

montaIdiomas($("#idioma"), pinta);
$("#cargando").textContent = T("cargando");
